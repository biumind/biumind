# Snapshot dry-run for the biu CLI release pipeline.
#
# Runs `goreleaser release --snapshot` on every PR that touches the
# release config or anything under apps/cli/biu/. Catches breakage in
# the GoReleaser config (yaml errors, ldflag typos, missing files) before
# someone cuts a real tag and the actual release blows up. No upload,
# no tag required.

name: biu release snapshot

on:
  pull_request:
    paths:
      - "apps/cli/biu/**"
      - ".github/workflows/release-biu*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli/biu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/biu/go.mod
          cache: true
          cache-dependency-path: apps/cli/biu/go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Snapshot release (no upload)
        run: |
          goreleaser release \
            --snapshot \
            --clean \
            --skip=publish,sign \
            --config .goreleaser.yml

      - name: Sanity-check artefacts
        run: |
          set -e
          ls -la dist/
          # Expect 4 archives (darwin/linux × amd64/arm64) plus a
          # checksums.txt.
          archive_count=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          if [ "$archive_count" -lt 4 ]; then
            echo "::error::Expected ≥4 archives, got $archive_count"
            ls -la dist/
            exit 1
          fi
          test -f dist/checksums.txt || {
            echo "::error::dist/checksums.txt missing"
            exit 1
          }

      - name: Upload snapshot for inspection
        uses: actions/upload-artifact@v4
        with:
          name: biu-snapshot
          path: |
            apps/cli/biu/dist/*.tar.gz
            apps/cli/biu/dist/checksums.txt
          retention-days: 7
