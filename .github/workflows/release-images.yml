# Release images — push container images to multiple registries.
#
# Registries (all optional except GHCR; presence-gated by vars/secrets):
#   * GHCR (always)      → ghcr.io/biumind/<service>
#   * Docker Hub         → docker.io/<DOCKERHUB_NAMESPACE>/<service>
#                          needs vars.DOCKERHUB_NAMESPACE
#                               + secrets.DOCKERHUB_USERNAME / _TOKEN
#   * Aliyun ACR (个人版) → <ALIYUN_REGISTRY>/<ALIYUN_NAMESPACE>/<service>
#                          e.g. registry.cn-hangzhou.aliyuncs.com/biumind/<service>
#                          needs vars.ALIYUN_REGISTRY / _NAMESPACE
#                               + secrets.ALIYUN_USERNAME / _PASSWORD
# A missing namespace/secret silently skips that registry, so GHCR
# always works and the others are clean opt-in.
#
# Triggered by:
#   * Push to `main` — CI build of all 10 service images, tagged
#     `:sha-<short>` (immutable, per-commit) + `:main` (rolling).
#     Trivy-gated; NOT signed (release-only).
#   * `service-v*` tag (e.g. `service-v0.3.0`) — full release: builds
#     all 10 service images so they share a version tag and digest
#     table.
#   * `<svc>-v*` tag (e.g. `hub-v0.3.1`, `brain-v0.4.0`) — single-
#     service hotfix release; only the matching image is built.
#   * Manual workflow_dispatch with a `service` input — push just one.
#
# Each image is built FROM SCRATCH using the per-service Dockerfile
# (services/<name>/Dockerfile). Multi-arch (linux/amd64 + linux/arm64)
# via buildx; one build pushes every configured registry's tags.
#
# Trivy scan runs after each image is built and BLOCKS the push when a
# CRITICAL vulnerability is found. (Configurable via `severity` input
# below.) See .github/workflows/security.yml for the periodic scan of
# already-published images.

name: Release images

on:
  push:
    branches:
      # Every commit to main rebuilds all service images tagged
      # :sha-<short> + :main (rolling). Release tags below still
      # produce :v* + :latest; the two never collide.
      - main
    tags:
      # All-services release.
      - "service-v*"
      # Per-service hotfix tags. Each prefix MUST match a matrix row
      # below; the filter step extracts the service name from the tag.
      - "identity-v*"
      - "hub-v*"
      - "brain-v*"
      - "sandbox-v*"
      - "runtime-v*"
      - "realtime-v*"
      - "channels-v*"
      - "app_center-v*"
      - "authz-v*"
      - "deploy-v*"
  workflow_dispatch:
    inputs:
      service:
        description: "Single service to build (empty → all)"
        required: false
        type: choice
        options:
          - ""
          - identity
          - hub
          - brain
          - sandbox
          - runtime
          - realtime
          - channels
          - app_center
          - authz
          - deploy
      severity:
        description: "Trivy fail threshold"
        required: false
        default: "CRITICAL"
        type: choice
        options:
          - CRITICAL
          - HIGH,CRITICAL
          - MEDIUM,HIGH,CRITICAL

permissions:
  contents: read
  packages: write       # push to ghcr.io/biumind/*
  id-token: write       # cosign keyless signing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - hub
          - brain
          - sandbox
          - runtime
          - realtime
          - channels
          - app_center
          - authz
          - deploy

    steps:
      - uses: actions/checkout@v4

      # Skip rules:
      #   1. workflow_dispatch with a `service` input that doesn't match
      #      this matrix row.
      #   2. Per-service tag (e.g. `hub-v0.3.0`) that doesn't match this
      #      matrix row. The `service-v*` tag and a `main` branch push
      #      are both "all services", so they never skip.
      - name: Filter
        id: filt
        run: |
          want_service=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want_service="${{ inputs.service }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            # Branch push (e.g. main) — build ALL services, like the
            # `service-v*` tag. want_service stays empty.
            :
          elif [[ "$GITHUB_REF_NAME" != service-v* ]]; then
            # Tag format is "<service>-v<version>" — extract before the
            # last "-v". Use parameter expansion so we don't fork awk.
            tag="$GITHUB_REF_NAME"
            want_service="${tag%-v*}"
          fi
          if [ -n "$want_service" ] && [ "$want_service" != "${{ matrix.service }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.filt.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.filt.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.filt.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional registries — skipped unless both namespace var and
      # credential secret are configured in repo settings.
      - name: Log in to Docker Hub
        if: steps.filt.outputs.skip == 'false' && vars.DOCKERHUB_NAMESPACE != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: steps.filt.outputs.skip == 'false' && vars.ALIYUN_REGISTRY != '' && secrets.ALIYUN_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Compute version
        if: steps.filt.outputs.skip == 'false'
        id: ver
        env:
          SVC: ${{ matrix.service }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          ALIYUN_REG: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NS: ${{ vars.ALIYUN_NAMESPACE }}
        run: |
          # 1. version suffix(es) for this trigger
          if [[ "$GITHUB_REF_NAME" == *-v* ]]; then
            #   service-v0.3.0 → v0.3.0 (all services, same version)
            #   hub-v0.3.1     → v0.3.1 (hub-only hotfix)
            v="v${GITHUB_REF_NAME##*-v}"
            vers=("$v" "latest")
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # main branch → immutable :sha-<short> + rolling :main
            vers=("sha-${GITHUB_SHA::7}" "main")
          else
            vers=("latest")
          fi

          # 2. configured registries (GHCR always on)
          regs=("ghcr.io/biumind")
          [ -n "$DOCKERHUB_NS" ] && regs+=("docker.io/${DOCKERHUB_NS}")
          if [ -n "$ALIYUN_REG" ] && [ -n "$ALIYUN_NS" ]; then
            regs+=("${ALIYUN_REG}/${ALIYUN_NS}")
          fi

          # 3. cartesian product → full tag list
          {
            echo "tags<<EOF"
            for r in "${regs[@]}"; do
              for v in "${vers[@]}"; do
                echo "${r}/${SVC}:${v}"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push) for scan
        if: steps.filt.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # AMD64 only for the scan stage — Trivy scans the same layers
          # whether they're amd64 or arm64; doing both wastes 5 minutes.
          platforms: linux/amd64
          tags: ghcr.io/biumind/${{ matrix.service }}:scan-${{ github.run_id }}
          load: true       # load into local docker for trivy to read
          push: false

      - name: Trivy scan
        if: steps.filt.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/biumind/${{ matrix.service }}:scan-${{ github.run_id }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ inputs.severity || 'CRITICAL' }}
          vuln-type: "os,library"

      # Once Trivy has cleared the scan, build for both arches and push
      # to every configured registry (one build, multi-registry push).
      - name: Build + push (multi-arch)
        if: steps.filt.outputs.skip == 'false'
        id: pushed
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.ver.outputs.tags }}
          push: true
          provenance: true
          sbom: true

      # Signing only on release tags — keyless cosign writes a rekor
      # entry per image; skip for the per-commit :sha/:main CI builds.
      #The signature attaches to the GHCR ref by digest; the identical
      # manifest copied to Docker Hub / Aliyun verifies against the same
      # digest.
      - name: Install cosign
        if: steps.filt.outputs.skip == 'false' && startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.filt.outputs.skip == 'false' && startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.pushed.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/biumind/${{ matrix.service }}@${DIGEST}
