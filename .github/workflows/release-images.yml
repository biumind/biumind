# Release images — push container images to multiple registries.
#
# Registries (all optional except GHCR; presence-gated by vars/secrets):
#   * GHCR (always)      → ghcr.io/biumind/<name>
#   * Docker Hub         → docker.io/<DOCKERHUB_NAMESPACE>/<name>
#                          needs vars.DOCKERHUB_NAMESPACE
#                               + secrets.DOCKERHUB_USERNAME / _TOKEN
#   * Aliyun ACR (个人版) → <ALIYUN_REGISTRY>/<ALIYUN_NAMESPACE>/<name>
#                          e.g. registry.cn-hangzhou.aliyuncs.com/biumind/<name>
#                          needs vars.ALIYUN_REGISTRY / _NAMESPACE
#                               + secrets.ALIYUN_USERNAME / _PASSWORD
# A missing namespace/secret silently skips that registry, so GHCR
# always works and the others are clean opt-in.
#
# 镜像清单（18 个，与 deploy/docker-compose/docker-compose.yml 的 image 名一致，
# 私有化部署设 BIUMIND_REGISTRY=ghcr.io/biumind 即可纯拉取）:
#   * 11 Go 服务: identity / model-relay / brain / runtime / realtime /
#     app-center / aigc / authz / channels / sandbox / deploy
#   * 4 前端:     site / web-client / admin-web / miniapp-h5
#   * 3 worker:   worker-wiki-parse / aigc-worker /
#     worker-wiki-llm（wiki-llm 不在 compose，按需取用）
#
# Triggered by:
#   * Push to `main` — CI build of the CHANGED images only, tagged
#     `:sha-<short>` (immutable, per-commit) + `:main` (rolling).
#     The detect-changes job maps changed paths → images (each image's
#     inputs are exactly its Dockerfile COPY set: the service dir plus
#     shared deps like packages/go-sdk/biu). Unmapped/shared changes
#     (go-sdk, apps/cli/biu, this workflow file) fan out to every image
#     that COPYs them. Detection failure falls back to building ALL —
#     never the reverse. Trivy-gated; NOT signed (release-only).
#     Diff base 不是 github.event.before，而是「本 workflow 在 main 上
#     最近一次 conclusion=success 的 push run」的 head SHA：并发组
#     cancel-in-progress 会杀掉正在构建的 run，其未完成的镜像腿永远
#     不会推送；若 base 仍用 event.before，下一次 run 的 diff 会恰好
#     漏掉那批改动（2026-08-19 identity 镜像丢失事故）。cancelled /
#     failed 的 run 不推进 base，下一次 push 自动补建（代价只是多建，
#     不会少建）。查不到历史成功 run 时回落 event.before。
#   * `service-v*` tag (e.g. `service-v0.3.0`) — full release: builds
#     all images so they share a version tag and digest table.
#   * `<name>-v*` tag (e.g. `model-relay-v0.3.1`, `web-client-v0.4.0`) —
#     single-image hotfix release; only the matching image is built.
#     The tag prefix MUST equal the matrix row `name`.
#   * Manual workflow_dispatch with a `service` input — push just one.
#
# Each image is built FROM SCRATCH using its own Dockerfile (see the
# matrix `dockerfile`/`context` fields). Multi-arch (linux/amd64 +
# linux/arm64) via buildx unless a row overrides `platforms`.
# GHCR/Docker Hub 带 provenance/sbom attestations 一次构建推送；
# Aliyun ACR 个人版不支持 OCI 1.1 attestation manifest，由独立步骤
# 裸推（无 attestations，digest 与 GHCR 不同，详见该步骤注释）。
#
# Trivy scan runs after each image is built and BLOCKS the push when a
# CRITICAL vulnerability is found. (Configurable via `severity` input
# below.) See .github/workflows/security.yml for the periodic scan of
# already-published images.

name: Release images

on:
  push:
    branches:
      # Every commit to main rebuilds all images tagged
      # :sha-<short> + :main (rolling). Release tags below still
      # produce :v* + :latest; the two never collide.
      - main
    # Skip the full 18-image rebuild for doc/metadata-only changes
    # (README, CHANGELOG, LICENSE, …). A real code push still triggers;
    # release tags below are tag-scoped and unaffected in practice.
    # CAVEAT: paths-ignore also gates tag pushes, so never tag a
    # docs-only commit as service-v* / <name>-v* — it won't build.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "deploy/docker-compose/**"   # compose / Makefile / .env 不影响镜像构建
    tags:
      # All-images release.
      - "service-v*"
      # Per-image hotfix tags. Each prefix MUST match a matrix row `name`
      # below; the filter step extracts the image name from the tag
      # (`${tag%-v*}`, so hyphenated names like `web-client-v1.0.0` work).
      - "identity-v*"
      - "model-relay-v*"
      - "brain-v*"
      - "runtime-v*"
      - "realtime-v*"
      - "app-center-v*"
      - "aigc-v*"
      - "authz-v*"
      - "channels-v*"
      - "sandbox-v*"
      - "deploy-v*"
      - "site-v*"
      - "web-client-v*"
      - "admin-web-v*"
      - "miniapp-h5-v*"
      - "worker-wiki-parse-v*"
      - "aigc-worker-v*"
      - "worker-wiki-llm-v*"
  workflow_dispatch:
    inputs:
      service:
        description: "Single image to build (empty → all)"
        required: false
        type: choice
        options:
          - ""
          - identity
          - model-relay
          - brain
          - runtime
          - realtime
          - app-center
          - aigc
          - authz
          - channels
          - sandbox
          - deploy
          - site
          - web-client
          - admin-web
          - miniapp-h5
          - worker-wiki-parse
          - aigc-worker
          - worker-wiki-llm
      severity:
        description: "Trivy fail threshold"
        required: false
        default: "CRITICAL"
        type: choice
        options:
          - CRITICAL
          - HIGH,CRITICAL
          - MEDIUM,HIGH,CRITICAL

# Cancel a superseded in-flight run when a newer commit lands on the
# same ref (e.g. rapid main pushes); each tag keeps its own group so a
# release is never cancelled by another.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read        # detect-changes 查最近一次成功 run 的 head_sha
  packages: write       # push to ghcr.io/biumind/*
  id-token: write       # cosign keyless signing

jobs:
  # Map changed paths → images for branch pushes. Each image's inputs are
  # exactly what its Dockerfile COPYs (verified against the matrix below):
  # every Go service takes its own dir + packages/go-sdk/biu; brain and
  # runtime additionally take apps/cli/biu (go.mod replace); frontends and
  # workers are self-contained in their own dirs. Any detection failure,
  # an unknown force-push range, or an edit to THIS workflow → all=true
  # (build everything). Skipping is only ever the safe direction.
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.detect.outputs.all }}
      identity: ${{ steps.detect.outputs.identity }}
      model-relay: ${{ steps.detect.outputs.model-relay }}
      brain: ${{ steps.detect.outputs.brain }}
      runtime: ${{ steps.detect.outputs.runtime }}
      realtime: ${{ steps.detect.outputs.realtime }}
      app-center: ${{ steps.detect.outputs.app-center }}
      aigc: ${{ steps.detect.outputs.aigc }}
      authz: ${{ steps.detect.outputs.authz }}
      channels: ${{ steps.detect.outputs.channels }}
      sandbox: ${{ steps.detect.outputs.sandbox }}
      deploy: ${{ steps.detect.outputs.deploy }}
      site: ${{ steps.detect.outputs.site }}
      web-client: ${{ steps.detect.outputs.web-client }}
      admin-web: ${{ steps.detect.outputs.admin-web }}
      miniapp-h5: ${{ steps.detect.outputs.miniapp-h5 }}
      worker-wiki-parse: ${{ steps.detect.outputs.worker-wiki-parse }}
      aigc-worker: ${{ steps.detect.outputs.aigc-worker }}
      worker-wiki-llm: ${{ steps.detect.outputs.worker-wiki-llm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need github.event.before in the local history

      - name: Detect changed images
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Diff base：main 分支 push 时优先用「最近一次 conclusion=success
          # 的 push run」的 head SHA 而不是 event.before —— 上一次 run 若被
          # 并发组 cancel，它没跑完的镜像腿永远不会推送，用 event.before
          # 做 diff 会漏掉那批改动（2026-08-19 identity 镜像丢失事故）。
          # event=push 过滤掉手动单镜像 dispatch（那种 success 只推了一个
          # 镜像，不能当 base）。查不到则回落 event.before；diff 失败仍
          # 回落全量构建。
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_TYPE:-}" = "branch" ]; then
            # 注意顺序：先剥 @ref 后缀再取 basename —— @refs/heads/main
            # 里还有 /，先取 basename 会得到 "main"。
            WF_FILE="${GITHUB_WORKFLOW_REF%%@*}"; WF_FILE="${WF_FILE##*/}"
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_FILE/runs?branch=$GITHUB_REF_NAME&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
            # gh api 失败时错误 JSON 会进 stdout —— 只接受 40 位 hex SHA。
            if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "diff base: $BASE (last successful push run; event.before=$BEFORE)"
              BEFORE="$BASE"
            else
              echo "diff base: $BEFORE (event.before; no prior successful run found)"
            fi
          fi

          # image name → space-separated path prefixes (build inputs).
          declare -A paths=(
            [identity]="services/identity packages/go-sdk/biu"
            [model-relay]="services/model-relay packages/go-sdk/biu"
            [brain]="services/brain packages/go-sdk/biu apps/cli/biu"
            [runtime]="services/runtime packages/go-sdk/biu apps/cli/biu"
            [realtime]="services/realtime packages/go-sdk/biu"
            [app-center]="services/app_center packages/go-sdk/biu"
            [aigc]="services/aigc packages/go-sdk/biu"
            [authz]="services/authz packages/go-sdk/biu"
            [channels]="services/channels packages/go-sdk/biu"
            [sandbox]="services/sandbox packages/go-sdk/biu"
            [deploy]="services/deploy packages/go-sdk/biu"
            [site]="web/site"
            [web-client]="apps/client"
            [admin-web]="admin"
            [miniapp-h5]="apps/miniapp"
            [worker-wiki-parse]="workers/wiki-parse"
            [aigc-worker]="workers/aigc"
            [worker-wiki-llm]="workers/wiki-llm"
          )

          all=true
          declare -A hits=()
          # Only branch pushes get selective builds; tags and
          # workflow_dispatch keep their existing all/single semantics.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_TYPE:-}" = "branch" ] \
             && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
              all=false
              # Editing this workflow invalidates the mapping itself.
              if grep -qxF ".github/workflows/release-images.yml" <<<"$changed"; then
                all=true
              fi
              for name in "${!paths[@]}"; do
                hits[$name]=false
                for p in ${paths[$name]}; do
                  if grep -q "^${p}/" <<<"$changed"; then
                    hits[$name]=true
                    break
                  fi
                done
              done
              echo "changed files:"; echo "$changed"
            else
              echo "git diff failed — falling back to build ALL"
            fi
          fi

          for name in "${!paths[@]}"; do
            v="${hits[$name]:-true}"
            [ "$all" = "true" ] && v=true
            echo "$name=$v" >> "$GITHUB_OUTPUT"
          done
          echo "all=$all" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    # 行级覆盖：大镜像（Flutter web-client）放宽，其余默认 25min。
    timeout-minutes: ${{ matrix.timeout || 25 }}
    env:
      # secrets 不能直接出现在 if: 里 — 先在 job env 里折算成布尔字符串。
      HAVE_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      HAVE_ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        # 每行字段：
        #   name       — 镜像名 ghcr.io/biumind/<name>，也是 <name>-v* tag 前缀，
        #                与 deploy/docker-compose 的 image 名一致
        #   dockerfile — Dockerfile 路径（相对仓库根）
        #   context    — build context（默认仓库根 "."；前端/worker 用各自目录，
        #                与 compose build.context 对齐）
        #   platforms  — 默认 linux/amd64,linux/arm64
        #   timeout    — 默认 25min
        include:
          # ── Go 服务（context = 仓库根：Dockerfile 要 COPY packages/go-sdk/biu）
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: model-relay
            dockerfile: services/model-relay/Dockerfile
          - name: brain
            dockerfile: services/brain/Dockerfile
          - name: runtime
            dockerfile: services/runtime/Dockerfile
          - name: realtime
            dockerfile: services/realtime/Dockerfile
          - name: app-center          # 目录名 app_center，镜像名与 compose 对齐
            dockerfile: services/app_center/Dockerfile
          - name: aigc
            dockerfile: services/aigc/Dockerfile
          - name: authz
            dockerfile: services/authz/Dockerfile
          - name: channels
            dockerfile: services/channels/Dockerfile
          - name: sandbox
            dockerfile: services/sandbox/Dockerfile
          - name: deploy
            dockerfile: services/deploy/Dockerfile
          # ── 前端（context = 各自目录，与 compose build 段一致；site 例外 = 仓库根）
          - name: site
            dockerfile: web/site/Dockerfile
          - name: web-client
            dockerfile: apps/client/Dockerfile.web
            context: apps/client
            # Flutter Web 构建：SDK tar ~1.5GB + dart 编译，QEMU arm64 会慢到
            # 不现实（且可能失败）。产物是纯静态文件，amd64 镜像在 arm64 机器
            # 上可经 QEMU 运行 nginx，不值得为它付出双架构构建成本。
            platforms: linux/amd64
            timeout: 60
          - name: admin-web
            dockerfile: admin/Dockerfile
            context: admin
          - name: miniapp-h5
            dockerfile: apps/miniapp/Dockerfile.h5
            context: apps/miniapp
          # ── Python workers（context = 各自目录）
          - name: worker-wiki-parse
            dockerfile: workers/wiki-parse/Dockerfile
            context: workers/wiki-parse
          - name: aigc-worker         # compose 里 image 名是 aigc-worker（非 worker-aigc）
            dockerfile: workers/aigc/Dockerfile
            context: workers/aigc
          - name: worker-wiki-llm     # 不在 compose，按 worker-* 约定命名
            dockerfile: workers/wiki-llm/Dockerfile
            context: workers/wiki-llm

    steps:
      - uses: actions/checkout@v4

      # Skip rules:
      #   1. workflow_dispatch with a `service` input that doesn't match
      #      this matrix row.
      #   2. Per-image tag (e.g. `web-client-v0.3.0`) that doesn't match
      #      this matrix row. The `service-v*` tag is always "all images".
      #   3. Branch push (main) whose changed paths don't touch this
      #      image's build inputs (detect-changes job).
      - name: Filter
        id: filt
        run: |
          want_service=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want_service="${{ inputs.service }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            # Branch push (main) — build only images whose build inputs
            # changed (detect-changes job). all=true forces a full rebuild.
            if [ "${{ needs.detect-changes.outputs.all }}" != "true" ] && \
               [ "${{ needs.detect-changes.outputs[matrix.name] }}" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$GITHUB_REF_NAME" != service-v* ]]; then
            # Tag format is "<name>-v<version>" — strip the last "-v*" so
            # hyphenated names (web-client, worker-wiki-parse, …) survive.
            tag="$GITHUB_REF_NAME"
            want_service="${tag%-v*}"
          fi
          if [ -n "$want_service" ] && [ "$want_service" != "${{ matrix.name }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.filt.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.filt.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.filt.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional registries — skipped unless both namespace var and
      # credential secret are configured in repo settings.
      - name: Log in to Docker Hub
        if: steps.filt.outputs.skip == 'false' && vars.DOCKERHUB_NAMESPACE != '' && env.HAVE_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: steps.filt.outputs.skip == 'false' && vars.ALIYUN_REGISTRY != '' && env.HAVE_ALIYUN_PASSWORD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Compute version
        if: steps.filt.outputs.skip == 'false'
        id: ver
        env:
          SVC: ${{ matrix.name }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          ALIYUN_REG: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NS: ${{ vars.ALIYUN_NAMESPACE }}
        run: |
          # 1. version suffix(es) for this trigger
          if [[ "$GITHUB_REF_NAME" == *-v* ]]; then
            #   service-v0.3.0    → v0.3.0 (all images, same version)
            #   web-client-v0.3.1 → v0.3.1 (web-client-only hotfix)
            v="v${GITHUB_REF_NAME##*-v}"
            vers=("$v" "latest")
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # main branch → immutable :sha-<short> + rolling :main
            vers=("sha-${GITHUB_SHA::7}" "main")
          else
            vers=("latest")
          fi

          # 2. configured registries (GHCR always on).
          # Aliyun ACR 个人版 rejects OCI 1.1 attestation manifests
          # ("unknown manifest class for application/vnd.oci.empty.v1+json"),
          # so its tags go into a separate list pushed WITHOUT
          # provenance/sbom by the dedicated step below.
          regs=("ghcr.io/biumind")
          [ -n "$DOCKERHUB_NS" ] && regs+=("docker.io/${DOCKERHUB_NS}")

          # 3. cartesian product → full tag list
          {
            echo "tags<<EOF"
            for r in "${regs[@]}"; do
              for v in "${vers[@]}"; do
                echo "${r}/${SVC}:${v}"
              done
            done
            echo "EOF"
            echo "tags_aliyun<<EOF"
            if [ -n "$ALIYUN_REG" ] && [ -n "$ALIYUN_NS" ]; then
              for v in "${vers[@]}"; do
                echo "${ALIYUN_REG}/${ALIYUN_NS}/${SVC}:${v}"
              done
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (no push) for scan
        if: steps.filt.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          # AMD64 only for the scan stage — Trivy scans the same layers
          # whether they're amd64 or arm64; doing both wastes 5 minutes.
          # (web-client is amd64-only anyway, see its matrix row.)
          platforms: linux/amd64
          tags: ghcr.io/biumind/${{ matrix.name }}:scan-${{ github.run_id }}
          load: true       # load into local docker for trivy to read
          push: false

      - name: Trivy scan
        if: steps.filt.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/biumind/${{ matrix.name }}:scan-${{ github.run_id }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ inputs.severity || 'CRITICAL' }}
          vuln-type: "os,library"

      # Once Trivy has cleared the scan, build for the row's platforms and
      # push to GHCR/Docker Hub (Aliyun 由下一步单独裸推).
      - name: Build + push (multi-arch)
        if: steps.filt.outputs.skip == 'false'
        id: pushed
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.ver.outputs.tags }}
          push: true
          provenance: true
          sbom: true

      # Aliyun ACR 个人版不支持 OCI 1.1 attestation manifest
      # (provenance/sbom 的 subject 是 application/vnd.oci.empty.v1+json，
      # 推送被拒: "unknown manifest class")，所以单独裸推，不带
      # attestations。层全部命中上一步缓存，这里只重新导出 manifest。
      # 注意：无 attestations 意味着阿里云腿的 manifest digest 与 GHCR
      # 不同，cosign 签名（绑 GHCR digest）不覆盖阿里云 ref。
      - name: Build + push (Aliyun ACR, no attestations)
        if: steps.filt.outputs.skip == 'false' && vars.ALIYUN_REGISTRY != '' && vars.ALIYUN_NAMESPACE != '' && env.HAVE_ALIYUN_PASSWORD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.ver.outputs.tags_aliyun }}
          push: true
          provenance: false
          sbom: false

      # Signing only on release tags — keyless cosign writes a rekor
      # entry per image; skip for the per-commit :sha/:main CI builds.
      #The signature attaches to the GHCR ref by digest; the identical
      # manifest copied to Docker Hub verifies against the same digest.
      # (Aliyun 是另一次裸推，digest 不同，签名不覆盖它。)
      - name: Install cosign
        if: steps.filt.outputs.skip == 'false' && startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.filt.outputs.skip == 'false' && startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.pushed.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/biumind/${{ matrix.name }}@${DIGEST}
