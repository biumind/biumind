# Nightly build for the Flutter client.
#
# On every push to main that touches apps/client/** (plus manual
# workflow_dispatch), rebuilds Android .apk + macOS .dmg and publishes
# them as a VERSIONED, ACCUMULATING GitHub pre-release — one per run,
# tagged client-nightly.<run_number> (e.g. client-nightly.6). The
# newest sorts to the top of the Releases page by publish date and the
# history is retained; a final cleanup job prunes all but the latest 100.
#
# This is NOT a stable release:
#   * prerelease: true + make_latest: false → not the "latest" release,
#     won't notify followers as a real release, won't be served as the
#     stable download on the Releases page.
#   * releases.json untouched → client auto-update (minClientVersion)
#     only ever sees tagged stable releases. Real users never get
#     pushed a nightly.
#
# Signing is skipped (no APPLE_*/ANDROID_KEYSTORE_*/IOS_* secrets):
#   * macOS .dmg   — unsigned; Gatekeeper warns on first launch.
#   * Android .apk — debug-signed; side-loadable, Play Console rejects.
#   * iOS          — not built (needs the full IOS_* signing set).
# Stable, signed, distributed releases stay tag-triggered via
# release-client.yml (push a `client-v*` tag).
#
# Architecture: two parallel build jobs (ubuntu → Android, macos-14 →
# macOS) upload their artefact under a versioned name; a final
# `nightly-release` job downloads both and owns the versioned
# pre-release, so there is no create/update race between the two
# platform jobs. A `cleanup` job then drops anything older than the
# last 100 nightlies.

name: Client Nightly

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - ".github/workflows/release-client-nightly.yml"
  workflow_dispatch:

# Cancel a superseded in-flight run when a newer commit lands on main.
concurrency:
  group: client-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # create nightly tags + releases; prune old ones

jobs:
  android-apk:
    name: Android nightly .apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - name: Read client version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "asset=BiuMind-${v}-client-nightly.${{ github.run_number }}-android.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Milkdown editor bundle is not in the repo (.gitignore drops
      # assets/editor/ and web/editor/); build it or the native editor
      # region white-screens (index.html / chunks 404).
      - name: Build editor bundle (Milkdown)
        working-directory: apps/client/editor-web
        run: |
          npm ci
          npm run build
          test -f ../assets/editor/index.html
          test -d ../assets/editor/assets

      - name: pub get
        run: flutter pub get

      # Debug-signed (no keystore secret) — side-loadable for testing only.
      - name: Build .apk
        run: flutter build apk --release

      - name: Stage artefact
        env:
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          mkdir -p "$RUNNER_TEMP/nightly"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$RUNNER_TEMP/nightly/$ASSET"

      - name: Upload artefact (inter-job)
        uses: actions/upload-artifact@v7
        with:
          name: nightly-android
          path: ${{ runner.temp }}/nightly/${{ steps.ver.outputs.asset }}
          retention-days: 1

  macos-dmg:
    name: macOS nightly .dmg
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - name: Read client version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "asset=BiuMind-${v}-client-nightly.${{ github.run_number }}-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build editor bundle (Milkdown)
        working-directory: apps/client/editor-web
        run: |
          npm ci
          npm run build
          test -f ../assets/editor/index.html
          test -d ../assets/editor/assets

      - name: pub get
        run: flutter pub get

      - name: Build release
        run: flutter build macos --release

      # biu CLI sidecar into .app Resources (daemon auto-start). Nightly
      # builds only the host-arch (arm64) sidecar, not the 4 standalone
      # binaries — those feed releases.json, which this workflow skips.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Build biu sidecar
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          APP_RES="$GITHUB_WORKSPACE/apps/client/build/macos/Build/Products/Release/biumind.app/Contents/Resources"
          mkdir -p "$APP_RES"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -C apps/cli/biu -trimpath -ldflags='-s -w' \
            -o "$APP_RES/biu" ./cmd/biu

      # Unsigned — Gatekeeper warns on first launch (acceptable for nightly).
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg
        env:
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          create-dmg \
            --volname "BiuMind" \
            --window-size 600 380 \
            --icon-size 96 \
            --app-drop-link 420 180 \
            --icon "biumind.app" 180 180 \
            --no-internet-enable \
            "$ASSET" \
            "build/macos/Build/Products/Release/biumind.app"
          mkdir -p "$RUNNER_TEMP/nightly"
          mv "$ASSET" "$RUNNER_TEMP/nightly/"

      - name: Upload artefact (inter-job)
        uses: actions/upload-artifact@v7
        with:
          name: nightly-macos
          path: ${{ runner.temp }}/nightly/${{ steps.ver.outputs.asset }}
          retention-days: 1

  # Owns the versioned nightly pre-release — runs after both platform
  # builds so artefacts are ready. `always()` lets it run even if a build
  # failed, but the verify step blocks publish unless BOTH artefacts are
  # present (no partial nightly).
  nightly-release:
    name: Publish nightly pre-release
    needs: [android-apk, macos-dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && !cancelled()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags for the commit list

      - name: Read client version
        id: ver
        run: |
          v=$(grep -m1 '^version:' apps/client/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "android_asset=BiuMind-${v}-client-nightly.${{ github.run_number }}-android.apk" >> "$GITHUB_OUTPUT"
          echo "macos_asset=BiuMind-${v}-client-nightly.${{ github.run_number }}-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          merge-multiple: true
          path: nightly

      - name: Verify both artefacts present
        env:
          ANDROID: ${{ steps.ver.outputs.android_asset }}
          MACOS: ${{ steps.ver.outputs.macos_asset }}
        run: |
          ls -la nightly/
          test -f "nightly/$ANDROID" \
            || { echo "::error::android .apk missing — build failed"; exit 1; }
          test -f "nightly/$MACOS" \
            || { echo "::error::macOS .dmg missing — build failed"; exit 1; }

      - name: Build release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RUN: ${{ github.run_number }}
          ANDROID: ${{ steps.ver.outputs.android_asset }}
          MACOS: ${{ steps.ver.outputs.macos_asset }}
        run: |
          set -e
          # Newest existing nightly tag = the previous published build.
          # Tags are client-nightly.<run_number>; version-sort handles the
          # numeric run suffix (client-nightly.100 > client-nightly.42).
          prev=$(git tag --list 'client-nightly.*' --sort=-v:refname | sed -n '1p')
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            since="Based on changes since \`$prev\`"
            count=$(git rev-list --count "$range")
          else
            range=""
            since="No previous nightly found; showing the most recent commits."
            count=$(git rev-list --count HEAD)
          fi

          {
            echo "🐤 **Client Nightly Build #${RUN} (v${VERSION})**"
            echo
            echo "Automated build from the \`main\` branch."
            echo
            echo "## Commit Information"
            echo
            echo "$since"
            echo
            echo "**Commit count:** ${count}"
            echo
            if [ -n "$range" ]; then
              git log --pretty=format:'- \`%h\` %s' "$range"
            else
              git log --pretty=format:'- \`%h\` %s' -20
            fi
            echo
            echo
            echo "## ⚠️ Important Notes"
            echo
            echo "This is an automated nightly build and is **not** intended for production use."
            echo
            echo "- **macOS \`.dmg\`** — unsigned. Gatekeeper blocks first launch. Bypass: right-click → *Open*, or \`xattr -dr com.apple.quarantine ${MACOS}\`."
            echo "- **Android \`.apk\`** — debug-signed; side-load only. Not Play Store compatible."
            echo "- **iOS** — not built."
            echo
            echo "For signed, stable builds see the [latest release](https://github.com/${{ github.repository }}/releases/latest)."
            echo
            echo "## 📦 Installation"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Android | \`${ANDROID}\` |"
            echo "| macOS (Apple Silicon) | \`${MACOS}\` |"
          } > nightly-body.md

          cat nightly-body.md
          cat nightly-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish versioned nightly pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: client-nightly.${{ github.run_number }}
          name: Client Nightly #${{ github.run_number }} · ${{ steps.ver.outputs.date }}
          prerelease: true
          make_latest: "false"
          body_path: nightly-body.md
          files: |
            nightly/${{ steps.ver.outputs.android_asset }}
            nightly/${{ steps.ver.outputs.macos_asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 镜像到阿里云 OSS (S3 兼容) ──────────────────────────────
      # GH Release 国内下载慢/不稳; OSS 镜像做中国加速直链。
      # 布局: <bucket>/nightly/client-nightly.<run>/<asset>
      #       <bucket>/nightly/index.json   (最新夜版清单, 每次覆盖)
      # stable 根 + stable releases.json 绝不碰。
      # presence-gated: 未配 OSS 凭证则 skip, 不 fail
      # (照搬 release-images.yml 多 registry opt-in 风格)。
      # mc (S3 兼容) 经 docker 跑 — 与 tools/scripts/upload-release.sh 同模式,
      # 不引第三方 action (供应链面)。
      - name: Upload to Aliyun OSS
        if: vars.OSS_BUCKET != '' && secrets.OSS_ACCESS_KEY_SECRET != ''
        env:
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          DOWNLOAD_BASE: ${{ vars.RELEASES_DOWNLOAD_BASE }}
          RUN: ${{ github.run_number }}
          VERSION: ${{ steps.ver.outputs.version }}
          ANDROID: ${{ steps.ver.outputs.android_asset }}
          MACOS: ${{ steps.ver.outputs.macos_asset }}
        run: |
          set -eu
          REL="nightly/client-nightly.${RUN}"
          # 下载 url 优先 CNAME: 阿里云对 APK 经 OSS endpoint 公网下载返
          # ApkDownloadForbidden (见 schema/release/v1 manifest.json); CNAME 绕过。
          # CNAME 未配则退 OSS bucket 域名 + 警告 (dmg 可下, apk 会被拦)。
          if [ -n "$DOWNLOAD_BASE" ]; then
            BASE="$DOWNLOAD_BASE"
          else
            BASE="https://${OSS_BUCKET}.${OSS_ENDPOINT#https://}"
            echo "::warning::RELEASES_DOWNLOAD_BASE 未配 — index.json url 用 OSS endpoint, APK 经此域名下载会被阿里云拦截 (ApkDownloadForbidden)。配 CNAME 变量修复。"
          fi
          # sha256 + size (与 stable releases.json Asset 字段一致)
          sha_apk=$(sha256sum "nightly/$ANDROID" | awk '{print $1}')
          sha_dmg=$(sha256sum "nightly/$MACOS" | awk '{print $1}')
          size_apk=$(stat -c%s "nightly/$ANDROID")
          size_dmg=$(stat -c%s "nightly/$MACOS")
          # nightly/index.json — 夜版 canary 清单。非 v1 releases.json:
          # envelope 不同 (channel=nightly + run); Asset 对象沿用 v1 Asset
          # 形状 (platform enum/url/filename/size/sha256/signed/arch),
          # 客户端 asset 解析代码可复用。客户端开"每日构建"开关后才读。
          jq -n \
            --arg version "$VERSION" \
            --argjson run "$RUN" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg apk "$ANDROID" --arg dmg "$MACOS" \
            --arg base "$BASE" --arg rel "$REL" \
            --arg sha_apk "$sha_apk" --arg sha_dmg "$sha_dmg" \
            --argjson size_apk "$size_apk" --argjson size_dmg "$size_dmg" \
            '{
              manifest: "nightly-canary-v1",
              channel: "nightly",
              version: $version,
              run: $run,
              releasedAt: $releasedAt,
              notes: "Automated nightly build — not for production. Unsigned.",
              assets: [
                {platform:"android-apk", arch:"universal", signed:false,
                 url:($base+"/"+$rel+"/"+$apk), filename:$apk, sha256:$sha_apk, size:$size_apk},
                {platform:"macos-arm64", arch:"arm64", signed:false,
                 url:($base+"/"+$rel+"/"+$dmg), filename:$dmg, sha256:$sha_dmg, size:$size_dmg}
              ]
            }' > index.json
          echo "--- nightly/index.json ---"
          cat index.json
          # 两挂载: nightly/ (二进制) + index.json (清单); 容器内 mc alias + cp。
          docker run --rm \
            -v "$PWD/nightly:/artefacts:ro" \
            -v "$PWD/index.json:/index.json:ro" \
            -e EP="$OSS_ENDPOINT" -e AK="$OSS_AK" -e SK="$OSS_SK" \
            -e BUCKET="$OSS_BUCKET" -e REL="$REL" \
            --entrypoint /bin/sh \
            docker.io/minio/mc:latest -c '
              set -eu
              mc alias set oss "$EP" "$AK" "$SK"
              for f in /artefacts/*; do
                [ -f "$f" ] || continue
                mc cp "$f" "oss/$BUCKET/$REL/"
              done
              mc cp /index.json "oss/$BUCKET/nightly/index.json"
              echo "✓ nightly artefacts + index.json → oss/$BUCKET/$REL (+ nightly/index.json)"
            '

  # Keep the Releases list tidy: delete every nightly pre-release beyond
  # the most recent 100 (oldest first), tag included. The legacy rolling
  # `nightly` tag from the old scheme is also removed once it's gone.
  cleanup:
    name: Prune old nightlies
    runs-on: ubuntu-latest
    needs: nightly-release
    if: always() && !cancelled()
    timeout-minutes: 5

    steps:
      - name: Keep last 100 nightly pre-releases (+ OSS mirror)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          # 1. 收集 >100 最新之外的旧 nightly tag
          mapfile -t OLD < <(gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^client-nightly\.[0-9]+$' \
            | sort -V -r \
            | tail -n +101)
          echo "old nightlies to prune (${#OLD[@]}): ${OLD[*]:-<none>}"

          # 2. 删 GH release (即使 OSS 未配也跑)
          for tag in "${OLD[@]}"; do
            echo "::notice::deleting old nightly $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          # Legacy single rolling nightly release (pre-accumulating scheme).
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          # 3. 镜像删 OSS: 跟 GH 同步, 保持恰好 100 (与 nightly-release 上传布局对称)。
          #    tag 名 client-nightly.<digits> 无 shell 元字符, $TAGS 词分割展开安全。
          if [ "${#OLD[@]}" -gt 0 ] && [ -n "$OSS_BUCKET" ] && [ -n "$OSS_SK" ]; then
            docker run --rm \
              -e EP="$OSS_ENDPOINT" -e AK="$OSS_AK" -e SK="$OSS_SK" \
              -e BUCKET="$OSS_BUCKET" -e TAGS="${OLD[*]}" \
              --entrypoint /bin/sh \
              docker.io/minio/mc:latest -c '
                set -eu
                mc alias set oss "$EP" "$AK" "$SK"
                for tag in $TAGS; do
                  mc rm --recursive --force "oss/$BUCKET/nightly/$tag" || true
                done
                echo "✓ OSS nightly dirs pruned"
              '
          fi
