[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biumind"
version = "0.1.0"
description = "Python SDK for the BiuMind Agentics platform (Hub relay + Brain memory)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "BiuMind" }]
keywords = ["biumind", "ai", "llm", "agent", "memory", "rag"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
# Stdlib-only by design — see biumind/_http.py.
dependencies = []

[project.urls]
Homepage = "https://biumind.com"
Source   = "https://github.com/biumind/biumind"

[tool.setuptools.packages.find]
include = ["biumind*"]
exclude = ["tests*"]
