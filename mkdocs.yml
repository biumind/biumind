# BiuMind 在线文档 —— MkDocs Material
# 源: docs/（纯 markdown + 相对链接，GitHub 可直接浏览）
# 构建: mkdocs build → site/（gitignore 已忽略仓库根 /site/）
# 发布: web/site/Dockerfile docs-builder stage 烤进 site 镜像，nginx /docs serve
# 本地预览: task docs:serve
#
# 语法约定（保证 GitHub 与文档站双端渲染一致）:
#   - 提示块用 GitHub Alerts（> [!NOTE] / > [!TIP] / > [!WARNING]），Material 原生支持
#   - 不用 !!! admonition、不用 === "Tab"（GitHub 下不渲染）
#   - 站内链接一律相对路径

site_name: BiuMind 文档
site_description: BiuMind 一体化 AI 工作平台文档 —— 知识中枢、编码工作台、创作、云端工位、消息接入、应用中心
site_url: https://biumind.ai/docs/
repo_url: https://github.com/biumind/biumind
repo_name: biumind/biumind
edit_uri: edit/main/docs/
copyright: BiuMind Community License

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# i18n：folder 结构 —— 默认语言（中文）留根路径，英文镜像在 docs/en/ 同构目录。
# 站内链接不用改：en 页里的相对链接在 en 目录内解析；GitHub 上两棵树都可直接浏览。
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: BiuMind Docs
          # nav 标题翻译：key 必须与 nav: 段的中文标题逐字一致（含空格）。
          nav_translations:
            首页: Home
            入门: Getting Started
            什么是 BiuMind: What is BiuMind
            快速开始: Quick Start
            下载与安装: Download & Install
            用户指南: User Guides
            知识中枢与笔记: Knowledge Hub & Notes
            对话: Chat
            编码工作台: Coding Workbench
            创作 (AIGC): Creation (AIGC)
            应用中心: App Center
            Skills 使用: Using Skills
            账号与设置: Account & Settings
            上手: Getting Started
            使用指南: Usage Guide
            命令参考: Command Reference
            权限与 Hooks: Permissions & Hooks
            BIUMIND.md 记忆: BIUMIND.md Memory
            沙箱: Sandbox
            自托管: Self-Hosting
            部署指南: Deployment Guide
            本地开发栈 (compose): Local Dev Stack (compose)
            环境变量参考: Environment Variables Reference
            开发者: Developers
            总览: Overview
            API 参考 (MCP + REST): API Reference (MCP + REST)
            BiuApp 开发: Building BiuApps
            Skills 开发: Building Skills

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      # 保留 CJK 的 slugify —— GitHub 锚点保留中文且小写（#快速上手、#mcp-服务器），
      # mkdocs 默认 slugify 会剥成 _1/_2 导致站内锚点全断。
      # pymdownx.slugs.slugify 是工厂函数；python/object/apply 映射节点用 kwds 键传参。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - 首页: index.md
  - 入门:
      - 什么是 BiuMind: getting-started/index.md
      - 快速开始: getting-started/quickstart.md
      - 下载与安装: getting-started/download.md
  - 用户指南:
      - 知识中枢与笔记: guide/knowledge.md
      - 对话: guide/chat.md
      - 编码工作台: guide/code.md
      - 创作 (AIGC): guide/creation.md
      - 应用中心: guide/apps.md
      - Skills 使用: guide/skills.md
      - 账号与设置: guide/settings.md
  - CLI (biu):
      - 上手: cli/getting-started.md
      - 使用指南: cli/usage.md
      - 命令参考: cli/commands.md
      - 权限与 Hooks: cli/permissions.md
      - BIUMIND.md 记忆: cli/biumind-md.md
      - 沙箱: cli/sandbox.md
  - 自托管:
      - 部署指南: self-hosting/index.md
      - 本地开发栈 (compose): self-hosting/compose.md
      - 环境变量参考: self-hosting/env-vars.md
  - 开发者:
      - 总览: developers/index.md
      - API 参考 (MCP + REST): developers/api.md
      - SDK Protocol: developers/sdk-protocol.md
      - SDK (Go / Python / Node): developers/sdks.md
      - BiuApp 开发: developers/biuapp.md
      - Skills 开发: developers/skills.md
