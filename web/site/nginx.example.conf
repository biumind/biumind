# BiuMind 官网 nginx 配置示例
#
# 用法：
#   1. pnpm build  →  生成 dist/
#   2. rsync dist/  到  /var/www/biumind-site/
#   3. 把本文件链接到  /etc/nginx/sites-enabled/biumind-site.conf  并 reload nginx
#
# 假设：
#   - SSL 证书走 Let's Encrypt（certbot --nginx）或在前置 LB 终结
#   - docs.biumind.ai 由 mkdocs build 输出到 /var/www/biumind-docs/
#   - app.biumind.ai 反代到 Flutter Web 客户端

# ──────────────── HTTP → HTTPS 跳转 ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name biumind.ai www.biumind.ai;
    return 301 https://biumind.ai$request_uri;
}

# ──────────────── 主站（HTTPS） ────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name biumind.ai www.biumind.ai;

    # SSL —— 替换为实际证书路径
    ssl_certificate     /etc/letsencrypt/live/biumind.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biumind.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # www → 裸域
    if ($host = www.biumind.ai) {
        return 301 https://biumind.ai$request_uri;
    }

    root /var/www/biumind-site;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # gzip + brotli（如装了 brotli 模块）
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ──────── 路由 ────────

    # /docs → 跳到独立文档站（mkdocs 部署点）
    location = /docs        { return 302 https://docs.biumind.ai/; }
    location ^~ /docs/      { return 302 https://docs.biumind.ai/; }

    # /app → 跳到 Flutter Web 客户端
    location = /app         { return 302 https://app.biumind.ai/; }
    location ^~ /app/       { return 302 https://app.biumind.ai/; }

    # 静态资源长缓存（Astro 生成的 _astro/ 已带 hash）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # favicon / sitemap
    location = /favicon.svg     { expires 7d; }
    location = /sitemap.xml     { expires 1h; alias /var/www/biumind-site/sitemap-index.xml; }
    location = /sitemap-index.xml { expires 1h; }
    location ~ ^/sitemap-\d+\.xml$ { expires 1h; }

    # 主路由：trailing slash 兼容；先尝试 .html，再尝试目录下 index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # HTML 不缓存（防止旧版本卡住）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 错误页用首页兜底（可选，避免 404 后用户失联）
    error_page 404 /404.html;
}
