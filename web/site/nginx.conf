# BiuMind 官网 nginx 配置（容器内使用，端口 80）
#
# 双角色:
#   1. 静态站  → /、/about、/_astro/* 等走本地文件
#   2. API 网关 → /v1/* 反代到 biu-net 内的后端服务 (identity / model-relay / brain / ...)
#
# ⚠️ 客户端(桌面+web)单 origin 寻址 —— 全部经这个 nginx 按路径反代, 不换端口。
#   新增后端 /v1/... 接口必须在此加 location, 否则该功能静默断(落到静态 404)。
#   路由归属(按上游):
#     identity : /v1/auth /v1/identity /v1/admin(兜底) /v1/announcements /v1/billing/webhook
#                /v1/plans /v1/subscriptions /v1/coupons /v1/referrals /v1/credits (订阅计费)
#     model-relay: /v1/messages /v1/admin/{providers,credentials,models,channels,pricing,
#                  fx-rates,model-groups} /v1/chat/estimate /v1/me/{usage,models} /v1/audio/
#     brain    : /v1/threads /v1/memory /v1/providers /v1/mcp /v1/wiki(含同步WS) /v1/graph
#                /v1/search /v1/agent(含会话WS) /v1/chat/{stats,search} /v1/tools /v1/files
#                /v1/notes /v1/notebooks /v1/note-tags (笔记, N1 纯REST+轮询)
#                /v1/brain/(files-by-sha CAS)
#     runtime  : /v1/agents /v1/skills
#     aigc     : /v1/models /v1/gallery /v1/generations /v1/characters /v1/voices /v1/aigc/
#     app-center: /v1/apps /v1/sidebar     authz: /v1/authz     realtime: /v1/realtime(SSE)
#   SPA 前缀: /app(web-client) /admin(admin-web) /m(miniapp-h5)。/v1/internal/* deny。
#   下载产物: /downloads/* → MinIO releases bucket (客户端安装包 + releases.json)
#
# 容器外的 SSL 终结由前置 layer 负责:
#   - 测试环境: frps (公网) 终结 *.your-domain.com 通配 SSL, frpc 转明文 HTTP 进来
#   - 生产环境: 公网 LB / NPM / cloudflare 等
#
# 必须前置: 容器加入 biu-net 网络 (docker-compose.yml 已配),
# 否则 proxy_pass http://identity:7004 这种 docker hostname 解析不了.

# DNS resolver — 让 nginx 启动后还能动态解析 upstream hostname (配合 set $upstream
# 变量 + proxy_pass 变量, 后端容器重建换 IP / 启动时缺席都不 emerg)。
# ⚠️ resolver IP 因容器运行时而异: Docker embedded DNS = 127.0.0.11,
#    podman (aardvark-dns) = 网络网关 IP (如 10.89.0.1)。硬编码 127.0.0.11 在
#    podman 下会 DNS 超时 → 所有 /v1/* 反代挂。故由 docker-entrypoint.d 的
#    05-resolver.sh 从容器自身 /etc/resolv.conf 提取首个 nameserver, 写到
#    /tmp/biumind-resolver.conf, 这里 include —— docker / podman 都自适应。
include /tmp/biumind-resolver.conf;

# WS upgrade map — $connection_upgrade 给 proxy_set_header Connection 用。
# 当客户端发 Upgrade: websocket 头时设 "upgrade"，否则设空（普通 HTTP，
# nginx 不会触发升级）。S3-5 Agent Plane WS endpoint 用，未来其他 WS 也可复用。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ──────── API 网关:/v1/* 反代到 biu-net 后端 ────────
    # 必须放在静态文件路由之前 — 优先匹配 API 前缀.

    # 内部 endpoint 不暴露公网 (realtime 的 /v1/internal/publish 走 mTLS / docker net)
    location ~ ^/v1/internal/ {
        deny all;
        return 403;
    }

    # ── 反代公共配置 (其他 location 通过 include 复用太啰嗦, 这里直接重复)
    # ── upstream 用 set + variable 强制 nginx 走 resolver 动态解析 (而不是启动时解析死)
    # ── 上游 timeouts 给宽松一点, 业务慢请求 (LLM) 不被切

    # Identity (注册/登录/JWT/admin/billing-webhook)
    location /v1/auth/ {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /v1/identity/ {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # ── /v1/admin/* 路由分流 ────────────────────────────────
    # identity 服务占用:  users / audit / monitor / system / rbac
    # model-relay 服务占用: providers / credentials / models / channels /
    #                      pricing / fx-rates / model-groups
    #
    # nginx location 最长前缀优先 — 7 条 model-relay 精确前缀放在前面,
    # 后面的通用 /v1/admin/ 兜底 identity. 路径完全不重叠, 不会误路由.
    # 模型管理后台权限由 model-relay 自己用 RoleCache.RequirePermission 校验,
    # identity admin 也是同一个机制, 共享 identity.role_permissions 表.

    # ── model-relay 管理 (M3 + M4: 模型配置后台) ────────────
    location /v1/admin/providers {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /v1/admin/credentials {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 凭证测试要打到上游 LLM, 与上游 RTT 同步; 给宽松超时
        proxy_read_timeout 60s;
    }
    location /v1/admin/models {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /v1/admin/models/sync-upstream 拉 basellm.github.io 5000+ 行,
        # 首次 ~5s, 给 90s 兜底慢网络.
        proxy_read_timeout 90s;
    }
    location /v1/admin/channels {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /v1/admin/pricing {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/admin/fx-rates {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/admin/model-groups {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # P4 段 4 / F2.5: 旧 /v1/admin/aigc/* compat 路由已删除. admin Vue
    # 现在统一调 /v1/admin/models?mode=... (走上面 model-relay location).
    # 历史路径如果还有客户端在调, 会落到下面 identity location 然后 404.

    # Identity 管理接口 — identity 服务端有 requireAdmin middleware 校验.
    # ⚠️ 暴露公网即给了攻击面 (虽然 401/403 但 endpoint 存在性已泄露).
    # 后续上线建议加 IP allowlist (allow x.x.x.x; deny all;) 或挪到 admin.* 子域.
    # 7 个 model-relay 路径已在前面被独立 location 优先匹配, 这里兜底其它.
    location /v1/admin/ {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Stripe billing webhook — Stripe 公网回调; identity 用 STRIPE_WEBHOOK_SECRET
    # 校验签名, 不依赖 Bearer token. 接 Stripe 后才会用到, 现在调一下也无害.
    location = /v1/billing/webhook {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── 订阅与计费 (identity) — 客户端「会员中心/订单历史/兑换码/邀请奖励」页 ──
    # handlers.go: /v1/plans /v1/subscriptions/* /v1/coupons/redeem
    #              /v1/referrals/{invite,claim} /v1/credits/{recharge-options,checkout}
    # 单 origin 下漏配这些 location → 四个页面点进去后端调用 404 (功能静默断).
    location /v1/plans {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/subscriptions {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/coupons {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/referrals {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /v1/credits {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # model-relay (LLM 转发, 流式响应可能很长)
    location = /v1/messages {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;            # 流式响应禁缓冲
        proxy_read_timeout 600s;        # LLM 长生成 10 分钟兜底
    }
    # 注: model-relay 当前只 mount 了 /v1/messages.
    # /v1/chat/completions / /v1/embeddings / /v1/keys 服务端未实现,
    # 用户/客户端没在调, 暂不加 location 避免误导 — 实现时再补.

    # Runtime (Agent 引擎)
    location /v1/agents {
        set $upstream "http://runtime:7002";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    # /v1/agui/* 暂不暴露 — runtime 未实现, 客户端没在调.

    # 技能管理 — runtime/internal/api 上的 skills_handlers + 自创作 propose 流.
    # GET/POST/PATCH/DELETE /v1/skills 与 /v1/skills/{id}/(toggle|approve|reject|share-org).
    # 不带 Web 端就会走到 site 静态路径 → 404 落到 Astro 的 not-found 页.
    location /v1/skills {
        set $upstream "http://runtime:7002";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Agent Plane (S3) — environments / sessions / refresh-token，brain 后端。
    # 详见 services/brain/internal/agentplane/api.go + router.go。
    #
    # 路由覆盖：
    #   POST   /v1/agent/environments                  注册 worker
    #   POST   /v1/agent/environments/{id}/heartbeat   续 30s 心跳
    #   GET    /v1/agent/environments                  列表
    #   DELETE /v1/agent/environments/{id}             注销
    #   POST   /v1/agent/sessions                      创建 session（chat/agent/task 三 mode）
    #   POST   /v1/agent/sessions/{id}/refresh-token   续 session_token
    #   GET    /v1/agent/sessions/{id}/stream          WS（S3-5 落地后启用 ⚠️）
    #
    # WS endpoint 落地前用同一 location 已经够 —— upgrade-aware 头 + 长
    # timeout 把所有路径都覆盖了。普通 JSON 请求多带几个无关头不影响。
    location /v1/agent/ {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS upgrade（/sessions/{id}/stream，S3-5）必要的头。$http_upgrade
        # 在普通请求里是空，nginx 不会真升级，安全无副作用。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长 turn 跑 LLM 可能花几分钟；普通 JSON 端点也够（HTTP keep-alive
        # 不依赖这个值）。WS 帧间隔靠应用层 KeepAlive (30s ping)。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # WS 流式响应必须关 buffer，否则 server→client 帧被 nginx 攒着。
        proxy_buffering off;
    }

    # Brain (Memory / Threads / Providers / Wiki / Graph / MCP / Search)
    location /v1/memory {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /v1/threads {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;        # threads/{id}/send 走 LLM, 拉长
        proxy_buffering off;            # send 是流式响应
        proxy_http_version 1.1;
    }
    # BYOK 模型 provider 管理 — 客户端 settings 页就在调这个
    # GET/POST/PATCH/DELETE /v1/providers, /v1/providers/{id}/check,
    # /v1/providers/{id}/models, /v1/providers/{id}/models/refresh, ...
    location /v1/providers {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;         # /providers/{id}/check 调上游验证, 给宽松点
    }
    location = /v1/mcp {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    # /v1/wiki/ 含普通 REST 与 Wiki 同步 WS (GET /v1/wiki/projects/{pid}/sync,
    # sync_ws_client.dart)。upgrade-aware 头对普通 JSON 无副作用 —— $http_upgrade
    # 为空时 nginx 不触发升级。缺这些头则 WS 握手失败(单 origin 后 Wiki 同步会断)。
    location /v1/wiki/ {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;          # 同步 WS 长连
        proxy_send_timeout 1h;
    }
    # /v1/notes 笔记域（N1：纯 REST + 轮询 changes，无 WS）—— 普通 proxy
    # 即可，不需要 upgrade 头。注意服务端路由是三个前缀：
    # /v1/notes /v1/notebooks /v1/note-tags。
    location /v1/notes {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/notebooks {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /v1/note-tags {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /v1/graph/ {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /v1/search {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Realtime (SSE 长连接 — 必须特殊配置)
    location /v1/realtime/ {
        set $upstream "http://realtime:7008";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 必要配置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;          # SSE 长连接, 默认 60s 太短
        proxy_send_timeout 1h;
    }

    # Authz (admin: reload policies)
    location /v1/authz/ {
        set $upstream "http://authz:7009";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ──────── 单 origin 补全路由 ────────
    # client 统一入口(桌面 + web)不再换端口, 以下路径以前只有 native 换端口
    # 直连才通, 现在都由 site nginx 按路径反代。上游 hostname = compose 服务名。

    # 公告 (identity)
    location /v1/announcements {
        set $upstream "http://identity:7004";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 计费预估 (model-relay) —— /v1/chat/ 前缀在 model-relay 与 brain 间劈开,
    # estimate 归 model-relay, stats/search 归 brain (下面两条)。精确前缀不重叠。
    location /v1/chat/estimate {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/chat/stats {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/chat/search {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 积分用量 (model-relay)
    location /v1/me/usage {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # P6: 公开模型目录 (model-relay) —— client/miniapp picker 直读官方模型
    # (markup 后价 + min_plan + max_output)。/v1/models 被 aigc 占用, 故走 /v1/me/* NS。
    location /v1/me/models {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 云端 TTS (model-relay /v1/audio/speech) —— 音频流式, 关 buffer。
    location /v1/audio/ {
        set $upstream "http://model-relay:7001";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # AIGC 创作 (aigc:7012) —— models/gallery/generations/characters/voices +
    # CAS 产物下载命名空间 /v1/aigc/files-by-sha。/v1/models 仅 aigc 占用
    # (model-relay 是 /v1/admin/models, 已被前面精确前缀优先匹配)。
    location /v1/models {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/gallery {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/generations {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;        # 提交生成任务/轮询
    }
    location /v1/characters {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/voices {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/aigc/ {
        set $upstream "http://aigc:7012";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # App Center (app-center:7011) —— catalog / installs / sidebar layout。
    location /v1/apps {
        set $upstream "http://app-center:7011";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /v1/sidebar {
        set $upstream "http://app-center:7011";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Tools 目录 / 调用 (brain /v1/tools)
    location /v1/tools {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;        # tools/invoke 可能跑较久
    }

    # 通用文件 (brain /v1/files/* upload/download/presign)
    location /v1/files {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;        # 上传/下载
    }
    # brain CAS 按 sha 下载 (/v1/brain/files-by-sha/{sha}, app 图标/附件)。
    # 独立命名空间 —— 不能挂 /v1/files/ 下 (Go 1.22 mux 与 {id}/meta 冲突),
    # 与 aigc 的 /v1/aigc/ 对称。
    location /v1/brain/ {
        set $upstream "http://brain:7003";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ──────── Flutter Web 客户端 (方案 B: 路径前缀 /app/) ────────
    # 用户访问 https://your-biumind.example.com/app/ → SPA.
    # web-client 容器在 default network 内, 同 project 起来, hostname=web-client.
    # proxy_pass 末尾 / 剥掉 /app/ 前缀 — 容器内 nginx 在 root 提供, 跟 dev 一致.
    # client 镜像里 flutter build 时 --base-href /app/, index.html 注入 <base href="/app/">,
    # 浏览器拿到的相对资源路径会自动加 /app/, 落回这个 location 转给容器.
    #
    # SPA 路由刷新 (e.g. /app/chat/abc): site → /chat/abc → client try_files → /index.html ✓
    # 静态资源 (/app/main.dart.js): site → /main.dart.js → client 命中 .js 缓存规则 ✓
    #
    # upstream 用 set + variable 强制 nginx 走 resolver 动态解析,
    # 否则 web-client 容器还没起时 site 整体启动会 emerg 退.
    location = /app {
        return 301 /app/;
    }
    # ──────── 后台管理系统 (Vue) — 路径前缀 /admin/ ────────
    # 用户访问 https://your-biumind.example.com/admin/ → 后台 SPA.
    # admin-web 容器在 default network 内, hostname=admin-web.
    # 跟 /app/ 同模式: rewrite + proxy_pass 不带 URI 显式剥前缀
    # (proxy_pass 用变量时不会自动剥, 必须显式 rewrite).
    location /admin/ {
        set $admin_upstream "http://admin-web:80";
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
    # /admin (无尾斜杠) → 重定向到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    # ──────── MiniApp H5 (uni-app) — 路径前缀 /m/ ────────
    # 用户访问 https://your-biumind.example.com/m/ → uni-app H5 SPA.
    # miniapp-h5 容器在 default network 内, hostname=miniapp-h5.
    # 跟 /admin/ 同模式: rewrite + proxy_pass 不带 URI 显式剥前缀.
    # vite base + h5 router base 都设了 /m/, 浏览器拿到的资源 URL 自动带前缀.
    #
    # OAuth 回调路径 /v1/auth/wechat/h5-callback 不在这里 — 走前面的
    # /v1/auth/ location 进 identity 后端. callback 完成 302 redirect 到
    # /m/pages/me/oauth-return#... 才回到这层.
    location /m/ {
        set $miniapp_h5_upstream "http://miniapp-h5:80";
        rewrite ^/m/(.*)$ /$1 break;
        proxy_pass $miniapp_h5_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @miniapp_h5_unavailable;
    }
    location = /m {
        return 301 /m/;
    }
    location @miniapp_h5_unavailable {
        add_header Content-Type "text/html; charset=utf-8" always;
        return 503 '<!doctype html><meta charset="utf-8"><title>BiuMind MiniApp</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;background:#FAFAFA;color:#18181B;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;max-width:480px;padding:0 24px}h1{font-size:24px;font-weight:600;margin:0 0 12px}p{color:#52525B;font-size:15px;line-height:1.6}a{color:#5B5BD6}</style><main><h1>BiuMind H5 维护中</h1><p>稍后再试或访问 <a href="/">首页</a>。</p></main>';
    }

    # ── 客户端 releases.json (官网 /download 页 + 客户端更新检测) ──
    # 只反代 releases.json 这一个小文件 (来源由 RELEASES_UPSTREAM env 注入,
    # dev=本地 MinIO / prod=阿里云 OSS, 见 docker-entrypoint.d/06-releases-upstream.sh)。
    # 产物大文件 (dmg/apk/...) 不经 nginx — releases.json 里的 url 是 OSS 直链。
    include /tmp/biumind-releases.conf;

    location /app/ {
        set $web_client_upstream "http://web-client:80";
        # ⚠️ proxy_pass 用变量时 nginx 不会剥 location 前缀 (即使末尾写了 /),
        # 默认把 /app/foo.js 整个转给上游, 导致 web-client 找不到文件 → SPA
        # fallback 到 /index.html, 浏览器收到 1825 bytes text/html 但请求的是 .js,
        # 报 "MIME type ('text/html') is not executable".
        # 用 rewrite ... break + proxy_pass 不带 URI 显式剥前缀.
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $web_client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        # web-client 还没起来时给个友好的 503 而不是 emerg
        proxy_intercept_errors on;
        error_page 502 503 504 = @app_unavailable;
    }
    location @app_unavailable {
        add_header Content-Type "text/html; charset=utf-8" always;
        return 503 '<!doctype html><meta charset="utf-8"><title>BiuMind App</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;background:#FAFAFA;color:#18181B;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;max-width:480px;padding:0 24px}h1{font-size:24px;font-weight:600;letter-spacing:-0.04em;margin:0 0 12px}p{color:#52525B;font-size:15px;line-height:1.6;margin:0 0 20px}a{color:#5B5BD6;text-decoration:none;font-weight:500}a:hover{text-decoration:underline}</style><main><h1>Web 版正在准备中</h1><p>BiuMind Web 版还没部署到当前环境。试试 <a href="/download">下载客户端</a> 或 <a href="/">回到首页</a>。</p></main>';
    }

    # ──────── 静态站路由 ────────

    # Astro 生成的带 hash 静态资源 → 长缓存 1 年
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # favicon / sitemap
    location = /favicon.svg {
        expires 7d;
        access_log off;
    }
    location = /sitemap.xml {
        alias /usr/share/nginx/html/sitemap-index.xml;
        expires 1h;
    }
    location = /sitemap-index.xml {
        expires 1h;
    }
    location ~ ^/sitemap-\d+\.xml$ {
        expires 1h;
    }

    # HTML 不缓存，避免旧版本卡用户
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 健康检查（compose / k8s 探针）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 在线文档（mkdocs build 烤进镜像，见 Dockerfile docs-builder stage）。
    # root 指 docs 父目录：root + uri(/docs/...) = /usr/share/nginx/docs/...
    # （不用 alias —— nginx try_files 不认 alias 只认 root，alias 下 try_files 落到 server root 404）。
    # mkdocs 目录 URL（/docs/<slug>/index.html）靠 index + try_files $uri/ 命中。
    location = /docs {
        return 301 /docs/;
    }
    # ^~ 让前缀匹配跳过 regex —— 否则 index index.html 触发的内部重定向到
    # /docs/index.html 会被 `location ~* \.html$`(line 741) 劫持，落到 server root 404。
    location ^~ /docs/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # 主路由：trailing slash 兼容；先文件、再 .html、再目录 index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 错误页（可选，先用 index.html 兜底）
    error_page 404 /index.html;
}
