# Admin SPA — 容器内 nginx 配置.
#
# 注意:
# - site nginx 反代时 rewrite ^/admin/(.*)$ /$1 break + proxy_pass 不带
#   URI, 所以本容器收到的是剥前缀后的路径 (e.g. GET /, GET /assets/x.js)
# - 不接收 /v1/* 请求 (那个由 site nginx 直接分发到后端)
# - 容器内 root 提供, SPA fallback 到 /index.html
# - 必须 listen [::]:80 (IPv6) 否则 wget healthcheck 失败

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全头比 site 严格 — admin 不允许被任何 iframe 嵌入
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # 健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的静态资源 (vite build 输出在 assets/) → 长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    # HTML 不缓存, 拿最新版本
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback: 任何不是文件的路径 → /index.html (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml;
}
