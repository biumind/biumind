# BiuMind Python workers（workers profile）
# 文档摄入 / 向量化 / 视觉描述 / 代码 AST 抽取 / AIGC / wiki-parse
# NATS JetStream 收任务，写回 Postgres + MinIO。设计见 DESIGN.md。

name: biumind

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-worker-env: &worker-env
  BIUMIND_ENV: ${BIUMIND_ENV:-test}
  BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biu_core}?sslmode=disable
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${MINIO_BUCKET:-biumind}
  MODEL_RELAY_URL: http://model-relay:7001
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

x-worker-depends: &worker-depends
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy
  minio-bootstrap:
    condition: service_completed_successfully

services:
  # ingest worker：PDF / Word / Markdown / HTML 解析
  worker-ingest:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/worker-ingest:${BIUMIND_TAG:-dev}
    container_name: biu-worker-ingest
    <<: [*restart, *logging]
    environment:
      <<: *worker-env
      WORKER_NAME: ingest
      WORKER_CONCURRENCY: 2
      NATS_SUBJECT: biumind.test.brain.ingest.requested
      NATS_DURABLE: ingest-worker
    networks: [biu-net]
    depends_on: *worker-depends

  # embed worker：文本/代码向量化
  worker-embed:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/worker-embed:${BIUMIND_TAG:-dev}
    container_name: biu-worker-embed
    <<: [*restart, *logging]
    environment:
      <<: *worker-env
      WORKER_NAME: embed
      WORKER_CONCURRENCY: 4
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      EMBED_DIM: 1024
      NATS_SUBJECT: biumind.test.brain.embed.requested
      NATS_DURABLE: embed-worker
    networks: [biu-net]
    depends_on: *worker-depends

  # vision worker：图片 caption / OCR
  worker-vision:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/worker-vision:${BIUMIND_TAG:-dev}
    container_name: biu-worker-vision
    <<: [*restart, *logging]
    environment:
      <<: *worker-env
      WORKER_NAME: vision
      WORKER_CONCURRENCY: 2
      VISION_MODEL: ${VISION_MODEL:-claude-haiku-4-5}
      NATS_SUBJECT: biumind.test.brain.vision.requested
      NATS_DURABLE: vision-worker
    networks: [biu-net]
    depends_on: *worker-depends

  # extract worker：代码 AST（tree-sitter）+ 知识图谱抽取
  worker-extract:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/worker-extract:${BIUMIND_TAG:-dev}
    container_name: biu-worker-extract
    <<: [*restart, *logging]
    environment:
      <<: *worker-env
      WORKER_NAME: extract
      WORKER_CONCURRENCY: 2
      NATS_SUBJECT: biumind.test.brain.extract.requested
      NATS_DURABLE: extract-worker
    networks: [biu-net]
    depends_on: *worker-depends

  # aigc worker — 订阅 aigc.task.submit，走 P4.S1.3 注入的 NATS payload 凭证调上游（DESIGN.md §11）
  # DASHSCOPE/VOLCENGINE env 仅 fallback；payload 凭证优先
  worker-aigc:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/aigc-worker:${BIUMIND_TAG:-dev}
    container_name: biu-worker-aigc
    <<: [*restart, *logging]
    environment:
      BIUMIND_ENV: ${BIUMIND_ENV:-test}
      BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      BIUMIND_AIGC_QUEUE: aigc-py
      BIUMIND_AIGC_TIMEOUT_S: "600"
      BIUMIND_AIGC_POLL_INTERVAL_S: "3.0"
      AIGC_S3_ENDPOINT: http://minio:9000
      AIGC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
      AIGC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      AIGC_S3_REGION: us-east-1
      AIGC_BUCKET_OUTPUTS: biumind-aigc-outputs
      AIGC_BUCKET_PUBLIC: biumind-aigc-public
      # 上游 provider key — payload 缺时 fallback
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      # 生成经 model-relay 单一 egress（I6，DESIGN.md §11）
      AIGC_GENERATE_VIA_RELAY: ${AIGC_GENERATE_VIA_RELAY:-true}
      AIGC_MODEL_RELAY_URL: http://model-relay:7001
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
    networks: [biu-net]
    depends_on:
      nats:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  # wiki-parse worker — 订阅 wiki.parse.requested + 60s tick rescan，解析 upload 文件回写 wiki_sources
  # 不连 postgres/minio — blob 经 brain internal presign 端点下载，保持只 NATS + brain HTTP 形态
  worker-wiki-parse:
    profiles: [workers, all]
    image: ${BIUMIND_REGISTRY:-biumind}/worker-wiki-parse:${BIUMIND_TAG:-dev}
    container_name: biu-worker-wiki-parse
    <<: [*restart, *logging]
    environment:
      BIUMIND_ENV: ${BIUMIND_ENV:-test}
      BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      BIUMIND_BRAIN_URL: http://brain:7003
      BIUMIND_INTERNAL_TOKEN: ${BIUMIND_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      BIUMIND_WIKI_PARSE_QUEUE: brain-wiki-parse
      BIUMIND_WIKI_PARSE_INTERVAL_S: "60"
      BIUMIND_WIKI_PARSE_MAX_BYTES: "209715200"
    networks: [biu-net]
    depends_on:
      nats:
        condition: service_healthy
      brain:
        condition: service_healthy
