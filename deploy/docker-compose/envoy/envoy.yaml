# Envoy gateway 配置（测试环境精简版）
# 生产用 ext_authz 接 identity；这里测试用 jwt_authn filter
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: gateway-listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                # SSE 关键：禁止响应 buffering
                stream_idle_timeout: 0s
                request_timeout: 0s
                http2_protocol_options:
                  initial_stream_window_size: 4194304
                use_remote_address: true
                xff_num_trusted_hops: 1
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                http_filters:
                  # 拒绝 WebSocket upgrade（架构强约束）
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(handle)
                            local upgrade = handle:headers():get("upgrade")
                            if upgrade and string.lower(upgrade) == "websocket" then
                              handle:respond(
                                {[":status"] = "426"},
                                "WebSocket upgrade is not allowed by BiuMind gateway. Use SSE instead."
                              )
                            end
                          end
                  # JWT 验证（测试环境简化；生产替换为 ext_authz）
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        biumind-identity:
                          issuer: https://identity.biumind.local
                          audiences: [biumind-api]
                          # 测试用 local jwks endpoint；生产从 identity OIDC discovery 取
                          remote_jwks:
                            http_uri:
                              uri: http://identity:7004/.well-known/jwks.json
                              cluster: identity
                              timeout: 3s
                            cache_duration: { seconds: 300 }
                          forward: true
                          forward_payload_header: x-biumind-claims
                      rules:
                        - match: { prefix: "/healthz" }
                        - match: { prefix: "/api/version" }
                        - match: { prefix: "/v1/auth/" }      # 登录类放行
                        - match: { prefix: "/v1/" }
                          requires: { provider_name: biumind-identity }
                  # ratelimit（local rate limit；生产换成 redis-backed）
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: gateway_rl
                      token_bucket:
                        max_tokens: 1000
                        tokens_per_fill: 1000
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value: { numerator: 100, denominator: HUNDRED }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: biumind-routes
                  virtual_hosts:
                    - name: biumind
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/v1/auth/" }
                          route: { cluster: identity, timeout: 30s }
                        - match: { prefix: "/v1/identity/" }
                          route: { cluster: identity, timeout: 30s }
                        - match: { prefix: "/v1/keys" }
                          route: { cluster: model-relay, timeout: 30s }
                        - match: { prefix: "/v1/chat/" }
                          route:
                            cluster: model-relay
                            timeout: 0s          # SSE 不限时
                            idle_timeout: 0s
                        - match: { prefix: "/v1/messages" }
                          route: { cluster: model-relay, timeout: 0s, idle_timeout: 0s }
                        - match: { prefix: "/v1/embeddings" }
                          route: { cluster: model-relay, timeout: 60s }
                        - match: { prefix: "/v1/agui/" }
                          route:
                            cluster: runtime
                            timeout: 0s
                            idle_timeout: 0s
                        - match: { prefix: "/v1/agents" }
                          route: { cluster: runtime, timeout: 0s, idle_timeout: 0s }
                        # Realtime: 唯一面向客户端的实时 SSE 入口
                        - match: { prefix: "/v1/realtime/stream" }
                          route:
                            cluster: realtime
                            timeout: 0s
                            idle_timeout: 0s
                        - match: { prefix: "/v1/realtime/" }
                          route: { cluster: realtime, timeout: 30s }
                        # Authz: 仅 admin/管理控制面调；客户端不直连
                        - match: { prefix: "/v1/authz/" }
                          route: { cluster: authz, timeout: 10s }
                        - match: { prefix: "/v1/wiki/" }
                          route: { cluster: brain, timeout: 0s, idle_timeout: 0s }
                        # Notes: N1 纯 REST + 轮询（无 WS），普通 timeout 即可
                        - match: { prefix: "/v1/notes" }
                          route: { cluster: brain, timeout: 60s }
                        - match: { prefix: "/v1/notebooks" }
                          route: { cluster: brain, timeout: 60s }
                        - match: { prefix: "/v1/note-tags" }
                          route: { cluster: brain, timeout: 60s }
                        - match: { prefix: "/v1/graph/" }
                          route: { cluster: brain, timeout: 60s }
                        - match: { prefix: "/v1/search" }
                          route: { cluster: brain, timeout: 30s }
                        # App Center: catalog / install / sidebar / webhook（M1-M17）
                        - match: { prefix: "/v1/apps" }
                          route: { cluster: app-center, timeout: 30s }
                        - match: { prefix: "/v1/sidebar/" }
                          route: { cluster: app-center, timeout: 30s }
                        - match: { prefix: "/webhooks/app_center/" }
                          route: { cluster: app-center, timeout: 30s }
                        - match: { prefix: "/healthz" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok" }

  clusters:
    - name: identity
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: identity
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: identity, port_value: 7004 }
    - name: model-relay
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: model-relay
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: model-relay, port_value: 7001 } } }
    - name: runtime
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: runtime
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: runtime, port_value: 7002 } } }
    - name: brain
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: brain
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: brain, port_value: 7003 } } }
    - name: realtime
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: RING_HASH                # consistent hash on device_id 头
      # Realtime 监听 HTTP/1.1（标准 SSE 走 chunked transfer，不走 h2 流）。
      # 之前误配 http2_protocol_options 导致 envoy 与 upstream 协议不一致，
      # 全部 SSE 请求 502 UPE。
      load_assignment:
        cluster_name: realtime
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: realtime, port_value: 7008 } } }
    - name: authz
      connect_timeout: 0.5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: authz
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: authz, port_value: 7009 } } }
    - name: app-center
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: app-center
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: app-center, port_value: 7011 } } }
