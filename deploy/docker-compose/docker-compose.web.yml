# BiuMind 前端层 — site（统一入口 nginx）+ 三个被反代的 SPA（DESIGN.md §7）。
# 折叠进主栈：site 是统一入口（静态官网 + /v1/* 反代后端 + /app /admin /m 反代 SPA），
# client（桌面+web）一律指向 site（本地 http://localhost:8088）。web-client/admin-web/
# miniapp-h5 不绑 host port，只经 site nginx 暴露。都在 biu-net 内用 docker hostname 互访。
# 镜像与后端一致走 ${BIUMIND_REGISTRY}/<name>:${BIUMIND_TAG}。

# 4 个前端容器共用最小权限 hardening（DESIGN.md §18）
x-frontend: &frontend
  restart: unless-stopped
  profiles: [services, all]
  networks: [biu-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  tmpfs:
    - /var/cache/nginx:size=64M
    - /var/run:size=8M
    - /tmp:size=16M
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - NET_BIND_SERVICE

services:
  # 官网 site（Astro 静态站 + API 网关 nginx + 内嵌 mkdocs 文档 /docs）
  site:
    <<: *frontend
    build:
      # context = 仓库根：mkdocs.yml + docs/ 在根，Dockerfile docs-builder stage 要 COPY 它们。
      # （其它三个 SPA 各自独立 context，不受影响。）
      context: ../..
      dockerfile: web/site/Dockerfile
    image: ${BIUMIND_REGISTRY:-biumind}/site:${BIUMIND_TAG:-dev}
    container_name: biu-site
    ports:
      - "${SITE_PORT:-8088}:80"
    environment:
      # releases.json 反代上游：dev 本地 MinIO /releases，prod CNAME OSS（避 ApkDownloadForbidden，DESIGN.md §7）
      - RELEASES_UPSTREAM=${RELEASES_UPSTREAM:-http://minio:9000/releases}
    depends_on:
      - web-client
      - admin-web
      - miniapp-h5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Flutter Web 客户端（site nginx /app/ 入口）
  web-client:
    <<: *frontend
    build:
      context: ../../apps/client
      dockerfile: Dockerfile.web
      args:
        BASE_HREF: /app/
    image: ${BIUMIND_REGISTRY:-biumind}/web-client:${BIUMIND_TAG:-dev}
    container_name: biu-web-client
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 后台管理 Vue（site nginx /admin/ 入口）
  admin-web:
    <<: *frontend
    build:
      context: ../../admin
      dockerfile: Dockerfile
    image: ${BIUMIND_REGISTRY:-biumind}/admin-web:${BIUMIND_TAG:-dev}
    container_name: biu-admin-web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # MiniApp H5 uni-app（site nginx /m/ 入口）
  miniapp-h5:
    <<: *frontend
    build:
      context: ../../apps/miniapp
      dockerfile: Dockerfile.h5
      args:
        BASE: /m/
    image: ${BIUMIND_REGISTRY:-biumind}/miniapp-h5:${BIUMIND_TAG:-dev}
    container_name: biu-miniapp-h5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
