# BiuMind Docker Compose — 单文件全栈（dev/test only）
#
# ⚠️ 定位：本文件仅为开发 / 测试环境的启动示例（dev/test only）。
#    生产环境的部署方式、安全加固（端口收敛 / HTTPS / 密钥轮换等）与日常运维
#    由使用者自行负责，仓库不提供也不维护生产部署方案。
#
# 用法：裸 `docker compose up -d` 默认起完整栈（infra + 全部 Go 服务 + 前端 + workers）。
#   要子集就点名服务：docker compose up -d postgres minio nats   # 只起基础设施
# 便捷入口见 Makefile（make up / up-infra）；设计 rationale 见 DESIGN.md。
#
# 镜像源：业务镜像 = ${BIUMIND_REGISTRY}/biumind/<name>:${BIUMIND_TAG}，namespace 固定
# biumind，只换 host：
#   Aliyun 北京(默认) → 不设 或 registry.cn-beijing.aliyuncs.com
#   GitHub GHCR       → ghcr.io
#   Docker Hub        → docker.io
# tag 默认 main（CI 每次 main push 推送）；本地构建用 make build-images + make up-local。

name: biumind

# ─── 公共 YAML 锚点（原分散在各子文件，合并后统一收在顶部）─────────
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Go 业务服务公共 env（服务间通信用 docker hostname）
x-svc-env: &svc-env
  BIUMIND_ENV: ${BIUMIND_ENV:-test}
  BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-biu_core}?sslmode=${POSTGRES_SSLMODE:-disable}
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${MINIO_BUCKET:-biumind}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-https://identity.biumind.local}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-biumind-api}
  # JWKS 验签 + HS256 fallback 见 DESIGN.md §10
  IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity:7004/.well-known/jwks.json}
  TZ: ${TZ:-UTC}

x-svc-depends: &svc-depends
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy

x-svc-env-extra: &svc-env-extra
  AUTHZ_URL: http://authz:7009
  REALTIME_INTERNAL_URL: http://realtime:7008

# 4 个前端容器共用最小权限 hardening（DESIGN.md §18）
x-frontend: &frontend
  restart: unless-stopped
  networks: [biu-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  tmpfs:
    - /var/cache/nginx:size=64M
    - /var/run:size=8M
    - /tmp:size=16M
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - NET_BIND_SERVICE

# Python worker 公共 env / 依赖
x-worker-env: &worker-env
  BIUMIND_ENV: ${BIUMIND_ENV:-test}
  BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-biu_core}?sslmode=${POSTGRES_SSLMODE:-disable}
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${MINIO_BUCKET:-biumind}
  MODEL_RELAY_URL: http://model-relay:7001

x-worker-depends: &worker-depends
  postgres:
    condition: service_healthy
  nats:
    condition: service_healthy
  minio-bootstrap:
    condition: service_completed_successfully

networks:
  biu-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  nats-data:
  # Identity RSA 签名密钥 — 首启生成 0600，后续复用保 token 有效（DESIGN.md §9）
  identity-keys:
  # App Center 内置 tasks App 文件持久化 — 刻意不进 DB（JSON fsync 单文件，DESIGN.md §14）
  app-center-data:

services:
  # ═══ 基础设施（infra profile）═══════════════════════════════════

  # Postgres 16 + pgvector（中文分词 zhparser fallback 见 DESIGN.md §15）
  postgres:    # QUICKSTART 用 stock pgvector 镜像（无 zhparser）。中文 FTS 用 ./postgres/Dockerfile（当前 Debian Trixie 编译坏，待修）
    image: ${INFRA_REGISTRY:-docker.io}/pgvector/pgvector:pg16
    container_name: biu-postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biumind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biumind_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-biu_core}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [biu-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biumind} -d ${POSTGRES_DB:-biu_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MinIO（对象存储：原始文档 / 媒体 / 构建产物）
  minio:
    image: ${INFRA_REGISTRY:-docker.io}/minio/minio:latest
    container_name: biu-minio
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biumind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [biu-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 启动后建 bucket + ILM（one-shot，DESIGN.md §16）
  minio-bootstrap:
    image: ${INFRA_REGISTRY:-docker.io}/minio/mc:latest
    container_name: biu-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biumind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-biumind}
    networks: [biu-net]
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}-snapshots &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}-deploy &&
      mc anonymous set download local/$${MINIO_BUCKET}-deploy &&
      mc mb --ignore-existing local/biumind-aigc-uploads &&
      mc mb --ignore-existing local/biumind-aigc-outputs &&
      mc mb --ignore-existing local/biumind-aigc-derivatives &&
      mc mb --ignore-existing local/biumind-aigc-public &&
      mc mb --ignore-existing local/biumind-aigc-temp &&
      mc anonymous set download local/biumind-aigc-public &&
      mc mb --ignore-existing local/releases &&
      mc anonymous set download local/releases &&
      mc ilm rule add local/biumind-aigc-uploads --expire-days 30 || true &&
      mc ilm rule add local/biumind-aigc-derivatives --expire-days 30 || true &&
      mc ilm rule add local/biumind-aigc-temp --expire-days 1 || true &&
      echo 'MinIO buckets ready (incl. aigc-{uploads,outputs,derivatives,public,temp}, releases)'
      "
    restart: "no"

  # NATS JetStream（跨语言队列 / 事件总线，DESIGN.md §17）
  nats:
    image: ${INFRA_REGISTRY:-docker.io}/library/nats:2.10-alpine
    container_name: biu-nats
    <<: [*restart, *logging]
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks: [biu-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══ 业务服务（services profile）══════════════════════════════════
  # 镜像 tag 默认 :dev，make build-images 构建。设计 rationale / 依赖链 / env / secret 见 DESIGN.md。

  # Authz（Cedar 统一授权）— 所有服务权限判断过它，first start 必装
  authz:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/authz:${BIUMIND_TAG:-main}
    container_name: biu-authz
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: authz
      LISTEN_ADDR: ":7009"
      POLICIES_PATH: /etc/biumind/authz/policies
      DECISION_CACHE_TTL_SEC: "30s"
    ports:
      - "${AUTHZ_PORT:-7009}:7009"
    volumes:
      - ./authz/policies:/etc/biumind/authz/policies:ro
    networks: [biu-net]
    depends_on: *svc-depends
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7009/healthz"]
      interval: 10s
      retries: 5

  # Realtime（单 SSE 多 topic 实时网关）— 面向客户端实时事件必走它（I8）
  realtime:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/realtime:${BIUMIND_TAG:-main}
    container_name: biu-realtime
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: realtime
      LISTEN_ADDR: ":7008"
      AUTHZ_URL: http://authz:7009
      LEDGER_RETENTION_HOURS: "1"
      MAX_CONN_BUFFER: "1024"
      HEARTBEAT_SEC: "15s"
    ports:
      - "${REALTIME_PORT:-7008}:7008"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7008/healthz"]
      interval: 10s
      retries: 5

  # Identity（用户/团队/认证）— 密钥目录由镜像预建并 chown，volume 首建继承属主（DESIGN.md §9）
  identity:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/identity:${BIUMIND_TAG:-main}
    container_name: biu-identity
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: identity
      LISTEN_ADDR: ":7004"
      # RS256 签名密钥路径，首启自动生成（4096-bit, 0600），后续复用（DESIGN.md §10）
      JWT_SIGNING_KEY_FILE: /var/lib/biumind/identity/jwt-signing-key.pem
      # 会话 TTL — 详见 docs/BiuMind-Identity-Session-Design.md §五
      IDENTITY_ACCESS_TTL: ${IDENTITY_ACCESS_TTL:-24h}
      IDENTITY_REFRESH_TTL: ${IDENTITY_REFRESH_TTL:-2160h}
      IDENTITY_REFRESH_ABSOLUTE_TTL: ${IDENTITY_REFRESH_ABSOLUTE_TTL:-8760h}
      IDENTITY_REFRESH_REUSE_GRACE: ${IDENTITY_REFRESH_REUSE_GRACE:-10s}
      # MiniApp 9 端 + H5 OAuth — APPID 公开走 .env.test；*_APPSECRET / *_PRIVATE_KEY 走 Jenkins Credentials（DESIGN.md §8）
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_APPSECRET: ${WECHAT_MP_APPSECRET:-}
      WECHAT_WEB_APPID: ${WECHAT_WEB_APPID:-}
      WECHAT_WEB_APPSECRET: ${WECHAT_WEB_APPSECRET:-}
      H5_FRONTEND_BASE_URL: ${H5_FRONTEND_BASE_URL:-}
      ALIPAY_MP_APPID: ${ALIPAY_MP_APPID:-}
      ALIPAY_MP_APPSECRET: ${ALIPAY_MP_APPSECRET:-}
      ALIPAY_MP_PRIVATE_KEY: ${ALIPAY_MP_PRIVATE_KEY:-}
      ALIPAY_MP_PUBLIC_KEY: ${ALIPAY_MP_PUBLIC_KEY:-}
      TOUTIAO_MP_APPID: ${TOUTIAO_MP_APPID:-}
      TOUTIAO_MP_APPSECRET: ${TOUTIAO_MP_APPSECRET:-}
      BAIDU_MP_APPID: ${BAIDU_MP_APPID:-}
      BAIDU_MP_APPSECRET: ${BAIDU_MP_APPSECRET:-}
      QQ_MP_APPID: ${QQ_MP_APPID:-}
      QQ_MP_APPSECRET: ${QQ_MP_APPSECRET:-}
      KUAISHOU_MP_APPID: ${KUAISHOU_MP_APPID:-}
      KUAISHOU_MP_APPSECRET: ${KUAISHOU_MP_APPSECRET:-}
      JD_MP_APPID: ${JD_MP_APPID:-}
      JD_MP_APPSECRET: ${JD_MP_APPSECRET:-}
      LARK_MP_APPID: ${LARK_MP_APPID:-}
      LARK_MP_APPSECRET: ${LARK_MP_APPSECRET:-}
      # W1: 服务间共享 bearer（model-relay / aigc 调 /v1/internal/*）— 多服务同值（DESIGN.md §5）
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # W1: BYOK AES-256 主密钥（base64 32B，openssl rand -base64 32）。留空禁用 BYOK。严禁进 git（DESIGN.md §5）
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-}
      # 启动时把逗号分隔的邮箱列表自动提升为 superadmin（main.go:547 bootstrapAdmins）。
      # 邮箱必须已注册且通过验证；已是 superadmin 跳过（幂等）。留空不提升。
      BIUMIND_BOOTSTRAP_SUPERADMINS: ${BIUMIND_BOOTSTRAP_SUPERADMINS:-}
    volumes:
      - identity-keys:/var/lib/biumind/identity
    ports:
      - "${IDENTITY_PORT:-7004}:7004"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7004/healthz"]
      interval: 10s
      retries: 5

  # model-relay（模型网关：BYOK + 平台池 + 计费）
  model-relay:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/model-relay:${BIUMIND_TAG:-main}
    container_name: biu-model-relay
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: model-relay
      LISTEN_ADDR: ":7001"
      BIUMIND_MASTER_KEY: ${BIUMIND_MASTER_KEY}
      MODEL_RELAY_BRAIN_URL: http://brain:7003
      # 上游 key 已移到 admin 后台 model_relay.credentials（envelope 加密落库），不再走 *_API_KEY env（DESIGN.md §11）
      # Admin stack：设 MODEL_RELAY_ADMIN_DATABASE_URL 后自动跑 migration + 起 cache/supervisor + mount /v1/admin/*
      MODEL_RELAY_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-biu_core}?sslmode=${POSTGRES_SSLMODE:-disable}
      MODEL_RELAY_ADMIN_MIGRATIONS_DIR: /etc/biumind/migrations/model-relay
      MODEL_RELAY_SYNC_UPSTREAM_URL: ${MODEL_RELAY_SYNC_UPSTREAM_URL:-}
      # Daily fx-rate sync（USD↔CNY）。离线设 MODEL_RELAY_FX_SYNC_DISABLED=1
      MODEL_RELAY_FX_SYNC_URL: ${MODEL_RELAY_FX_SYNC_URL:-}
      MODEL_RELAY_FX_SYNC_DISABLED: ${MODEL_RELAY_FX_SYNC_DISABLED:-false}
      # W1: chat 计费 + BYOK 路由走 identity internalapi（DESIGN.md §5）
      MODEL_RELAY_IDENTITY_URL: http://identity:7004
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # B-1: gating /v1/internal/embeddings（brain embedder 平台池）— 与 brain 同值（DESIGN.md §5）
      MODEL_RELAY_INTERNAL_TOKEN: ${MODEL_RELAY_INTERNAL_TOKEN:-biumind-dev-relay-internal-token-change-me}
    ports:
      - "${MODEL_RELAY_PORT:-7001}:7001"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7001/healthz"]
      interval: 10s
      retries: 5

  # Brain（Wiki + Graph + Memory + Search）
  brain:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/brain:${BIUMIND_TAG:-main}
    container_name: biu-brain
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: brain
      LISTEN_ADDR: ":7003"
      MODEL_RELAY_URL: http://model-relay:7001
      # B-1: embedding 走 relay internal lane（bge-m3, 1024-dim），绝不直连 openai（I6 / DESIGN.md §11）
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIMS: ${EMBED_DIMS:-1024}
      MODEL_RELAY_INTERNAL_TOKEN: ${MODEL_RELAY_INTERNAL_TOKEN:-biumind-dev-relay-internal-token-change-me}
      # W4 云端解析计费：pseudo-model code（pricing 行在 model_relay.pricing 配，
      # 空 = 免费兜底）。上线时在 .env 设 PARSE_BILLING_MODEL=wiki-parse-text
      PARSE_BILLING_MODEL: ${PARSE_BILLING_MODEL:-}
      # websearch（可选）：compose 不带 SearxNG；自行部署后在 .env 设 SEARXNG_URL 注入即启用
      SEARXNG_URL: ${SEARXNG_URL:-}
      # BYOK P3: brain 按需从 identity /v1/internal/byok/* 取 user key（DESIGN.md §5）
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:7004}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # Phase 3: gating brain /v1/internal/wiki/*（wiki-parse worker 用）— 与 worker 同值（DESIGN.md §5）
      BIUMIND_INTERNAL_TOKEN: ${BIUMIND_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # Chat 走 model-relay PassThrough（透传用户 JWT），模型/凭证全部 admin 后台配置；
      # legacy AGENT_PLANE_ANTHROPIC_* 直连已移除（runtime 段仍保留，属另一条链）
      # Files / MinIO — artifacts L3 通道。缺任一字段不 mount /v1/files/*（L1+L2 不受影响）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: biumind-files
      FILES_MAX_UPLOAD_BYTES: "104857600"  # 100MB
      # Wiki block events → JetStream durable（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      GRAPH_AUTO_EXTRACT: "true"
      # 笔记分享访问 JWT 密钥（§7.6）；留空 = 启动随机生成，多实例必须显式同值
      BRAIN_SHARE_SIGNING_KEY: ${BRAIN_SHARE_SIGNING_KEY:-}
    ports:
      - "${BRAIN_PORT:-7003}:7003"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      model-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7003/healthz"]
      interval: 10s
      retries: 5

  # Runtime（Go Agent 引擎）
  runtime:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/runtime:${BIUMIND_TAG:-main}
    container_name: biu-runtime
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: runtime
      LISTEN_ADDR: ":7002"
      MODEL_RELAY_URL: http://model-relay:7001
      BRAIN_URL: http://brain:7003
      # 测试环境 sandbox 走 local（K8s 不可用）
      SANDBOX_MODE: local
      # JetStream durable consumer 让重启不丢 channel 消息（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      RUNTIME_CHANNELS_DEFAULT_USER_ID: ${RUNTIME_CHANNELS_DEFAULT_USER_ID:-}
      RUNTIME_CHANNELS_DEFAULT_PROJECT_ID: ${RUNTIME_CHANNELS_DEFAULT_PROJECT_ID:-}
      # Agent Plane 自注册成 environment（worker_kind=runtime），缺则 agent_environments 空
      AGENT_PLANE_ADMIN_USER_ID: ${AGENT_PLANE_ADMIN_USER_ID:-}
      AGENT_PLANE_ANTHROPIC_API_KEY: ${BIUMIND_ANTHROPIC_KEY:-}
      AGENT_PLANE_ANTHROPIC_ENDPOINT: ${BIUMIND_ANTHROPIC_BASE_URL:-}
      # Skills-stdlib 启动时 upsert 到 runtime.skills（source='bundled'）
      SKILLS_STDLIB_DIR: /etc/biumind/skills-stdlib
    ports:
      - "${RUNTIME_PORT:-7002}:7002"
    networks: [biu-net]
    volumes:
      - ../../packages/skills-stdlib:/etc/biumind/skills-stdlib:ro
    depends_on:
      <<: *svc-depends
      model-relay:
        condition: service_healthy
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7002/healthz"]
      interval: 10s
      retries: 5

  # App Center（应用中心：catalog / install / 钩子 / sidebar / triggers）— 端口 7011（DESIGN.md §19）
  app-center:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/app-center:${BIUMIND_TAG:-main}
    container_name: biu-app-center
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: app_center
      LISTEN_ADDR: ":7011"
      BIUMIND_MIGRATIONS_DIR: /etc/biumind/migrations/app_center
      REALTIME_URL: http://realtime:7008
      MODEL_RELAY_URL: http://model-relay:7001
      # RSS AI worker chat 模型 — 指向 active channel 的 deepseek/claude，换模型只改这里
      RSS_DIGEST_MODEL: anthropic.claude-opus-4-8
      BRAIN_URL: http://brain:7003
      TASKS_STORE_PATH: /var/lib/biumind/app_center/tasks.json
      # Repo Apps（M1.4）GitHub 只读 token；空 = 匿名 60 req/h，启动 WARN 降级
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "${APP_CENTER_PORT:-7011}:7011"
    networks: [biu-net]
    volumes:
      - app-center-data:/var/lib/biumind/app_center
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      realtime:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7011/healthz"]
      interval: 10s
      retries: 5

  # Channels（多渠道 IM 网关；可选）
  channels:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/channels:${BIUMIND_TAG:-main}
    container_name: biu-channels
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: channels
      LISTEN_ADDR: ":7007"
      RUNTIME_URL: http://runtime:7002
      # inbound envelopes → JetStream，Runtime 重启不丢（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    ports:
      - "${CHANNELS_PORT:-7007}:7007"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7007/healthz"]
      interval: 10s
      retries: 5

  # AIGC（文生图 / 文生视频 / 数字人 / 爆款解析）— 端口 7012（DESIGN.md §19）。设计见 docs/BiuMind-AIGC-*.md
  aigc:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/aigc:${BIUMIND_TAG:-main}
    container_name: biu-aigc
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: aigc
      LISTEN_ADDR: ":7012"
      AIGC_DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-biu_core}?sslmode=${POSTGRES_SSLMODE:-disable}
      AIGC_MIGRATIONS_DIR: /etc/biumind/migrations/aigc
      AIGC_IDENTITY_URL: http://identity:7004
      # 服务间共享 bearer — 缺则 POST /v1/generations 全返 503 billing_not_wired（DESIGN.md §5）
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # P4.S1.3: aigc → model-relay 取 envelope 解密凭证注入 NATS payload（DESIGN.md §11）
      AIGC_MODEL_RELAY_URL: http://model-relay:7001
      NATS_URL: nats://nats:4222
      # MinIO / S3（5 bucket 由 minio-bootstrap 建，DESIGN.md §16）
      AIGC_S3_ENDPOINT: ${AIGC_S3_ENDPOINT:-http://minio:9000}
      AIGC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
      AIGC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      AIGC_S3_REGION: ${AIGC_S3_REGION:-us-east-1}
      AIGC_S3_USE_SSL: ${AIGC_S3_USE_SSL:-false}
      # 上游 provider keys（P3 才用；空则 worker 拒收 submit）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
    ports:
      - "${AIGC_PORT:-7012}:7012"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7012/healthz"]
      interval: 10s
      retries: 5

  # ═══ 前端层（services profile）═══════════════════════════════════
  # site 是统一入口（静态官网 + /v1/* 反代后端 + /app /admin /m 反代 SPA，DESIGN.md §7）；
  # client（桌面+web）一律指向 site（本地 http://localhost:8088）。web-client/admin-web/
  # miniapp-h5 不绑 host port，只经 site nginx 暴露。都在 biu-net 内用 docker hostname 互访。
  # 镜像与后端一致走 ${BIUMIND_REGISTRY}/biumind/<name>:${BIUMIND_TAG}。

  # 官网 site（Astro 静态站 + API 网关 nginx + 内嵌 mkdocs 文档 /docs）
  site:
    <<: *frontend
    build:
      # context = 仓库根：mkdocs.yml + docs/ 在根，Dockerfile docs-builder stage 要 COPY 它们。
      # （其它三个 SPA 各自独立 context，不受影响。）
      context: ../..
      dockerfile: web/site/Dockerfile
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/site:${BIUMIND_TAG:-main}
    container_name: biu-site
    ports:
      - "${SITE_PORT:-8088}:80"
    environment:
      # releases.json 反代上游：dev 本地 MinIO /releases，prod CNAME OSS（避 ApkDownloadForbidden，DESIGN.md §7）
      - RELEASES_UPSTREAM=${RELEASES_UPSTREAM:-http://minio:9000/releases}
    depends_on:
      - web-client
      - admin-web
      - miniapp-h5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Flutter Web 客户端（site nginx /app/ 入口）
  web-client:
    <<: *frontend
    build:
      context: ../../apps/client
      dockerfile: Dockerfile.web
      args:
        BASE_HREF: /app/
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/web-client:${BIUMIND_TAG:-main}
    container_name: biu-web-client
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 后台管理 Vue（site nginx /admin/ 入口）
  admin-web:
    <<: *frontend
    build:
      context: ../../admin
      dockerfile: Dockerfile
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/admin-web:${BIUMIND_TAG:-main}
    container_name: biu-admin-web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # MiniApp H5 uni-app（site nginx /m/ 入口）
  miniapp-h5:
    <<: *frontend
    build:
      context: ../../apps/miniapp
      dockerfile: Dockerfile.h5
      args:
        BASE: /m/
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/miniapp-h5:${BIUMIND_TAG:-main}
    container_name: biu-miniapp-h5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ═══ Python workers（workers profile）══════════════════════════════
  # 文档摄入 / AIGC / wiki-parse（向量化、视觉描述、图抽取已内建于 brain）
  # NATS JetStream 收任务，写回 Postgres + MinIO。设计见 DESIGN.md。

  # ingest worker：PDF / Word / Markdown / HTML 解析
  worker-ingest:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/worker-ingest:${BIUMIND_TAG:-main}
    container_name: biu-worker-ingest
    <<: [*restart, *logging]
    environment:
      <<: *worker-env
      WORKER_NAME: ingest
      WORKER_CONCURRENCY: 2
      NATS_SUBJECT: biumind.${BIUMIND_ENV:-test}.brain.ingest.requested
      NATS_DURABLE: ingest-worker
    networks: [biu-net]
    depends_on: *worker-depends

  # aigc worker — 订阅 aigc.task.submit，走 P4.S1.3 注入的 NATS payload 凭证调上游（DESIGN.md §11）
  # DASHSCOPE/VOLCENGINE env 仅 fallback；payload 凭证优先
  worker-aigc:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/aigc-worker:${BIUMIND_TAG:-main}
    container_name: biu-worker-aigc
    <<: [*restart, *logging]
    environment:
      BIUMIND_ENV: ${BIUMIND_ENV:-test}
      BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      BIUMIND_AIGC_QUEUE: aigc-py
      BIUMIND_AIGC_TIMEOUT_S: "600"
      BIUMIND_AIGC_POLL_INTERVAL_S: "3.0"
      AIGC_S3_ENDPOINT: ${AIGC_S3_ENDPOINT:-http://minio:9000}
      AIGC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
      AIGC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      AIGC_S3_REGION: ${AIGC_S3_REGION:-us-east-1}
      AIGC_BUCKET_OUTPUTS: biumind-aigc-outputs
      AIGC_BUCKET_PUBLIC: biumind-aigc-public
      # 上游 provider key — payload 缺时 fallback
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      # 生成经 model-relay 单一 egress（I6，DESIGN.md §11）
      AIGC_GENERATE_VIA_RELAY: ${AIGC_GENERATE_VIA_RELAY:-true}
      AIGC_MODEL_RELAY_URL: http://model-relay:7001
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
    networks: [biu-net]
    depends_on:
      nats:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  # wiki-parse worker — 订阅 wiki.parse.requested + 60s tick rescan，解析 upload 文件回写 wiki_sources
  # 不连 postgres/minio — blob 经 brain internal presign 端点下载，保持只 NATS + brain HTTP 形态
  worker-wiki-parse:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/worker-wiki-parse:${BIUMIND_TAG:-main}
    container_name: biu-worker-wiki-parse
    <<: [*restart, *logging]
    environment:
      BIUMIND_ENV: ${BIUMIND_ENV:-test}
      BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      BIUMIND_BRAIN_URL: http://brain:7003
      BIUMIND_INTERNAL_TOKEN: ${BIUMIND_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      BIUMIND_WIKI_PARSE_QUEUE: brain-wiki-parse
      BIUMIND_WIKI_PARSE_INTERVAL_S: "60"
      BIUMIND_WIKI_PARSE_MAX_BYTES: "209715200"
    networks: [biu-net]
    depends_on:
      nats:
        condition: service_healthy
      brain:
        condition: service_healthy

  # wiki-llm worker — 订阅 wiki.ingest.requested，调 model-relay 把 source
  # 文本转成 wiki 页（ingest 链路的 LLM 生成段，唯一烧 token 的 worker）。
  # 用 profile 控制：默认开发栈不起（避免无意产生 API 费用），
  # `docker-compose --profile llm up -d worker-wiki-llm` 或验证/部署时起。
  # BIUMIND_HUB_TOKEN 需为有效 JWT（静态服务 token，成本归属该 token 的
  # 用户；P2 规划改为 brain 按任务 owner 现签）。
  worker-wiki-llm:
    image: ${BIUMIND_REGISTRY:-registry.cn-beijing.aliyuncs.com}/biumind/worker-wiki-llm:${BIUMIND_TAG:-main}
    container_name: biu-worker-wiki-llm
    <<: [*restart, *logging]
    profiles: [llm]
    environment:
      BIUMIND_ENV: ${BIUMIND_ENV:-test}
      BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      BIUMIND_BRAIN_URL: http://brain:7003
      BIUMIND_INTERNAL_TOKEN: ${BIUMIND_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      BIUMIND_HUB_URL: ${WIKI_LLM_HUB_URL:-http://model-relay:7001}
      BIUMIND_HUB_TOKEN: ${WIKI_LLM_HUB_TOKEN:-}
      BIUMIND_WIKI_LLM_MODEL: ${WIKI_LLM_MODEL:-claude-haiku-4-5-20251001}
      BIUMIND_WIKI_LLM_TIMEOUT_S: "600"
    networks: [biu-net]
    depends_on:
      nats:
        condition: service_healthy
      brain:
        condition: service_healthy

