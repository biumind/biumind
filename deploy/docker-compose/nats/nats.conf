# NATS JetStream（测试环境）
server_name: biu-nats-test
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 4GB
}

# 测试环境无认证；生产用 NKey + accounts
# accounts {
#   BIUMIND: {
#     users: [{ user: biumind, password: ... }]
#     jetstream: enabled
#   }
# }

max_payload: 8MB
max_pending: 64MB
max_connections: 1000
write_deadline: "10s"

# 慢消费者保护（v2.10 之后的字段名是 write_deadline; 保留为参考）
