use_default_settings: true

general:
  debug: false
  instance_name: "BiuMind Search"

server:
  secret_key: "biumind_searxng_dev_secret_change_me"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.1"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Content-Security-Policy: "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'"

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: true
  infinite_scroll: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json    # 给 BiuMind Brain 用

# 给 Brain.Search 用的 JSON API
# GET /search?q=...&format=json
# 启用方式：上面 formats 里加 json + 此处不加 limiter

engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: arxiv
    disabled: false
