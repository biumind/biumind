# BiuMind 关键告警规则.
#
# 4 类告警 (severity 路由不同):
#   - critical: 服务完全挂掉 (immediate page)
#   - warning : 即将出问题 (15 分钟内运维介入)
#   - info    : 趋势异常 (运维次日审视)
#
# 每条 alert 必须有 description, runbook 链接 (后续维护).

groups:
  - name: service.availability
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} ({{ $labels.instance }}) 不可达"
          description: "Prometheus 1 分钟内 scrape {{ $labels.instance }} 持续失败. 服务可能挂了 / 网络不通 / OOM."

      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(biumind_http_requests_total{status_class="5xx"}[5m]))
            /
            sum by (service) (rate(biumind_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率 > 5%"
          description: "过去 5 分钟 {{ $labels.service }} 的 5xx 比例 = {{ $value | humanizePercentage }}, 检查日志."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (le, service) (rate(biumind_http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} P99 延迟 > 5s"
          description: "过去 10 分钟 {{ $labels.service }} P99 = {{ $value }}s. LLM 流式正常 ≤30s, 普通 REST 应 ≤1s."

  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres 不可用"
          description: "postgres-exporter 无法连接 PG, 检查 biu-postgres 容器."

      - alert: PostgresHighConnections
        expr: |
          sum(pg_stat_activity_count) by (datname)
          /
          on(datname) pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres 连接数 > 80%"
          description: "{{ $labels.datname }} 已用 {{ $value | humanizePercentage }} max_connections, 可能耗尽."

  - name: redis
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可用"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存 > 85%"
          description: "已用 {{ $value | humanizePercentage }}, 接近上限将触发 eviction."

  - name: host
    interval: 30s
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/host"} /
           node_filesystem_size_bytes{mountpoint="/host"}) < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "主机磁盘剩余 < 15%"
          description: "{{ $labels.instance }} {{ $labels.mountpoint }} 仅剩 {{ $value | humanizePercentage }}, 容器可能写不进数据."

      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机 CPU > 90%"
          description: "{{ $labels.instance }} 持续 10 分钟 CPU 高, 用户请求可能变慢."

      - alert: HostHighMemory
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机内存 > 90%"
          description: "{{ $labels.instance }} 内存吃紧, 可能 OOM-kill 容器."

  - name: container
    interval: 30s
    rules:
      - alert: ContainerRestarted
        expr: |
          rate(container_start_time_seconds{name=~"biu-.+"}[15m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "容器 {{ $labels.name }} 重启"
          description: "近 15 分钟内 {{ $labels.name }} 重启了, 看 docker logs."
