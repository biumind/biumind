# BiuMind 业务服务（services profile）。镜像 tag 默认 :dev，make build-images 构建。
# 设计 rationale / 依赖链 / env / secret 见 DESIGN.md。

name: biumind

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-svc-env: &svc-env
  BIUMIND_ENV: ${BIUMIND_ENV:-test}
  BIUMIND_LOG_LEVEL: ${BIUMIND_LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biu_core}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  NATS_URL: nats://nats:4222
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${MINIO_BUCKET:-biumind}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-https://identity.biumind.local}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-biumind-api}
  # JWKS 验签 + HS256 fallback 见 DESIGN.md §10
  IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity:7004/.well-known/jwks.json}
  TZ: ${TZ:-UTC}

x-svc-depends: &svc-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

x-svc-env-extra: &svc-env-extra
  AUTHZ_URL: http://authz:7009
  REALTIME_INTERNAL_URL: http://realtime:7008

services:
  # Authz（Cedar 统一授权）— 所有服务权限判断过它，first start 必装
  authz:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/authz:${BIUMIND_TAG:-dev}
    container_name: biu-authz
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: authz
      LISTEN_ADDR: ":7009"
      POLICIES_PATH: /etc/biumind/authz/policies
      DECISION_CACHE_TTL_SEC: "30s"
    ports:
      - "${AUTHZ_PORT:-7009}:7009"
    volumes:
      - ./authz/policies:/etc/biumind/authz/policies:ro
    networks: [biu-net]
    depends_on: *svc-depends
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7009/healthz"]
      interval: 10s
      retries: 5

  # Realtime（单 SSE 多 topic 实时网关）— 面向客户端实时事件必走它（I8）
  realtime:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/realtime:${BIUMIND_TAG:-dev}
    container_name: biu-realtime
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: realtime
      LISTEN_ADDR: ":7008"
      AUTHZ_URL: http://authz:7009
      LEDGER_RETENTION_HOURS: "1"
      MAX_CONN_BUFFER: "1024"
      HEARTBEAT_SEC: "15s"
    ports:
      - "${REALTIME_PORT:-7008}:7008"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7008/healthz"]
      interval: 10s
      retries: 5

  # Identity（用户/团队/认证）— init container 先 chown volume 给 nonroot UID 65532（DESIGN.md §9）
  identity-init:
    profiles: [services, all]
    image: ${INFRA_REGISTRY:-docker.io}/library/alpine:3.20
    container_name: biu-identity-init
    user: root
    volumes:
      - identity-keys:/var/lib/biumind/identity
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/biumind/identity
        chown -R 65532:65532 /var/lib/biumind/identity
        chmod 0700 /var/lib/biumind/identity
    restart: "no"
    networks: [biu-net]

  identity:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/identity:${BIUMIND_TAG:-dev}
    container_name: biu-identity
    <<: [*restart, *logging]
    environment:
      <<: *svc-env
      SERVICE_NAME: identity
      LISTEN_ADDR: ":7004"
      # RS256 签名密钥路径，首启自动生成（4096-bit, 0600），后续复用（DESIGN.md §10）
      JWT_SIGNING_KEY_FILE: /var/lib/biumind/identity/jwt-signing-key.pem
      # 会话 TTL — 详见 docs/BiuMind-Identity-Session-Design.md §五
      IDENTITY_ACCESS_TTL: ${IDENTITY_ACCESS_TTL:-24h}
      IDENTITY_REFRESH_TTL: ${IDENTITY_REFRESH_TTL:-2160h}
      IDENTITY_REFRESH_ABSOLUTE_TTL: ${IDENTITY_REFRESH_ABSOLUTE_TTL:-8760h}
      IDENTITY_REFRESH_REUSE_GRACE: ${IDENTITY_REFRESH_REUSE_GRACE:-10s}
      # MiniApp 9 端 + H5 OAuth — APPID 公开走 .env.test；*_APPSECRET / *_PRIVATE_KEY 走 Jenkins Credentials（DESIGN.md §8）
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_APPSECRET: ${WECHAT_MP_APPSECRET:-}
      WECHAT_WEB_APPID: ${WECHAT_WEB_APPID:-}
      WECHAT_WEB_APPSECRET: ${WECHAT_WEB_APPSECRET:-}
      H5_FRONTEND_BASE_URL: ${H5_FRONTEND_BASE_URL:-}
      ALIPAY_MP_APPID: ${ALIPAY_MP_APPID:-}
      ALIPAY_MP_APPSECRET: ${ALIPAY_MP_APPSECRET:-}
      ALIPAY_MP_PRIVATE_KEY: ${ALIPAY_MP_PRIVATE_KEY:-}
      ALIPAY_MP_PUBLIC_KEY: ${ALIPAY_MP_PUBLIC_KEY:-}
      TOUTIAO_MP_APPID: ${TOUTIAO_MP_APPID:-}
      TOUTIAO_MP_APPSECRET: ${TOUTIAO_MP_APPSECRET:-}
      BAIDU_MP_APPID: ${BAIDU_MP_APPID:-}
      BAIDU_MP_APPSECRET: ${BAIDU_MP_APPSECRET:-}
      QQ_MP_APPID: ${QQ_MP_APPID:-}
      QQ_MP_APPSECRET: ${QQ_MP_APPSECRET:-}
      KUAISHOU_MP_APPID: ${KUAISHOU_MP_APPID:-}
      KUAISHOU_MP_APPSECRET: ${KUAISHOU_MP_APPSECRET:-}
      JD_MP_APPID: ${JD_MP_APPID:-}
      JD_MP_APPSECRET: ${JD_MP_APPSECRET:-}
      LARK_MP_APPID: ${LARK_MP_APPID:-}
      LARK_MP_APPSECRET: ${LARK_MP_APPSECRET:-}
      # W1: 服务间共享 bearer（model-relay / aigc 调 /v1/internal/*）— 多服务同值（DESIGN.md §5）
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # W1: BYOK AES-256 主密钥（base64 32B，openssl rand -base64 32）。留空禁用 BYOK。严禁进 git（DESIGN.md §5）
      BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-}
    volumes:
      - identity-keys:/var/lib/biumind/identity
    ports:
      - "${IDENTITY_PORT:-7004}:7004"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      identity-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7004/healthz"]
      interval: 10s
      retries: 5

  # model-relay（模型网关：BYOK + 平台池 + 计费）
  model-relay:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/model-relay:${BIUMIND_TAG:-dev}
    container_name: biu-model-relay
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: model-relay
      LISTEN_ADDR: ":7001"
      BIUMIND_MASTER_KEY: ${BIUMIND_MASTER_KEY}
      MODEL_RELAY_BRAIN_URL: http://brain:7003
      # 上游 key 已移到 admin 后台 model_relay.credentials（envelope 加密落库），不再走 *_API_KEY env（DESIGN.md §11）
      # Admin stack：设 MODEL_RELAY_ADMIN_DATABASE_URL 后自动跑 migration + 起 cache/supervisor + mount /v1/admin/*
      MODEL_RELAY_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biu_core}?sslmode=disable
      MODEL_RELAY_ADMIN_MIGRATIONS_DIR: /etc/biumind/migrations/model-relay
      MODEL_RELAY_SYNC_UPSTREAM_URL: ${MODEL_RELAY_SYNC_UPSTREAM_URL:-}
      # Daily fx-rate sync（USD↔CNY）。离线设 MODEL_RELAY_FX_SYNC_DISABLED=1
      MODEL_RELAY_FX_SYNC_URL: ${MODEL_RELAY_FX_SYNC_URL:-}
      MODEL_RELAY_FX_SYNC_DISABLED: ${MODEL_RELAY_FX_SYNC_DISABLED:-false}
      # W1: chat 计费 + BYOK 路由走 identity internalapi（DESIGN.md §5）
      MODEL_RELAY_IDENTITY_URL: http://identity:7004
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # B-1: gating /v1/internal/embeddings（brain embedder 平台池）— 与 brain 同值（DESIGN.md §5）
      MODEL_RELAY_INTERNAL_TOKEN: ${MODEL_RELAY_INTERNAL_TOKEN:-biumind-dev-relay-internal-token-change-me}
    ports:
      - "${HUB_PORT:-7001}:7001"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7001/healthz"]
      interval: 10s
      retries: 5

  # Brain（Wiki + Graph + Memory + Search）
  brain:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/brain:${BIUMIND_TAG:-dev}
    container_name: biu-brain
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: brain
      LISTEN_ADDR: ":7003"
      MODEL_RELAY_URL: http://model-relay:7001
      # B-1: embedding 走 relay internal lane（bge-m3, 1024-dim），绝不直连 openai（I6 / DESIGN.md §11）
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIMS: ${EMBED_DIMS:-1024}
      MODEL_RELAY_INTERNAL_TOKEN: ${MODEL_RELAY_INTERNAL_TOKEN:-biumind-dev-relay-internal-token-change-me}
      SEARXNG_URL: http://searxng:8080
      # BYOK P3: brain 按需从 identity /v1/internal/byok/* 取 user key（DESIGN.md §5）
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:7004}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-}
      # Phase 3: gating brain /v1/internal/wiki/*（wiki-parse worker 用）— 与 worker 同值（DESIGN.md §5）
      BIUMIND_INTERNAL_TOKEN: ${BIUMIND_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # Chat 凭证优先级：BYOK provider > RelayURL+UserBearer 透传 JWT > 下面 legacy 直连。生产走 #2（DESIGN.md §11）
      AGENT_PLANE_ANTHROPIC_API_KEY: ${BIUMIND_ANTHROPIC_KEY:-}
      AGENT_PLANE_ANTHROPIC_ENDPOINT: ${BIUMIND_ANTHROPIC_BASE_URL:-}
      # Files / MinIO — artifacts L3 通道。缺任一字段不 mount /v1/files/*（L1+L2 不受影响）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${POSTGRES_USER:-biumind}
      MINIO_SECRET_KEY: ${BIUMIND_MINIO_PASSWORD:-biumind_minio_dev}
      MINIO_BUCKET: biumind-files
      FILES_MAX_UPLOAD_BYTES: "104857600"  # 100MB
      # Wiki block events → JetStream durable（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      GRAPH_AUTO_EXTRACT: "true"
    ports:
      - "${BRAIN_PORT:-7003}:7003"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      model-relay:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7003/healthz"]
      interval: 10s
      retries: 5

  # Runtime（Go Agent 引擎）
  runtime:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/runtime:${BIUMIND_TAG:-dev}
    container_name: biu-runtime
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: runtime
      LISTEN_ADDR: ":7002"
      MODEL_RELAY_URL: http://model-relay:7001
      BRAIN_URL: http://brain:7003
      # 测试环境 sandbox 走 local（K8s 不可用）
      SANDBOX_MODE: local
      # JetStream durable consumer 让重启不丢 channel 消息（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      RUNTIME_CHANNELS_DEFAULT_USER_ID: ${RUNTIME_CHANNELS_DEFAULT_USER_ID:-}
      RUNTIME_CHANNELS_DEFAULT_PROJECT_ID: ${RUNTIME_CHANNELS_DEFAULT_PROJECT_ID:-}
      # Agent Plane 自注册成 environment（worker_kind=runtime），缺则 agent_environments 空
      AGENT_PLANE_ADMIN_USER_ID: ${AGENT_PLANE_ADMIN_USER_ID:-}
      AGENT_PLANE_ANTHROPIC_API_KEY: ${BIUMIND_ANTHROPIC_KEY:-}
      AGENT_PLANE_ANTHROPIC_ENDPOINT: ${BIUMIND_ANTHROPIC_BASE_URL:-}
      # Skills-stdlib 启动时 upsert 到 runtime.skills（source='bundled'）
      SKILLS_STDLIB_DIR: /etc/biumind/skills-stdlib
      SANDBOX_URL: http://sandbox:7005
    ports:
      - "${RUNTIME_PORT:-7002}:7002"
    networks: [biu-net]
    volumes:
      - ../../packages/skills-stdlib:/etc/biumind/skills-stdlib:ro
    depends_on:
      <<: *svc-depends
      model-relay:
        condition: service_healthy
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7002/healthz"]
      interval: 10s
      retries: 5

  # App Center（应用中心：catalog / install / 钩子 / sidebar / triggers）— 端口 7011（DESIGN.md §19）
  app-center:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/app-center:${BIUMIND_TAG:-dev}
    container_name: biu-app-center
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: app_center
      LISTEN_ADDR: ":7011"
      BIUMIND_MIGRATIONS_DIR: /etc/biumind/migrations/app_center
      REALTIME_URL: http://realtime:7008
      MODEL_RELAY_URL: http://model-relay:7001
      # RSS AI worker chat 模型 — 指向 active channel 的 deepseek/claude，换模型只改这里
      RSS_DIGEST_MODEL: anthropic.claude-opus-4-8
      BRAIN_URL: http://brain:7003
      TASKS_STORE_PATH: /var/lib/biumind/app_center/tasks.json
    ports:
      - "${APP_CENTER_PORT:-7011}:7011"
    networks: [biu-net]
    volumes:
      - app-center-data:/var/lib/biumind/app_center
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      realtime:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7011/healthz"]
      interval: 10s
      retries: 5

  # Channels（多渠道 IM 网关；可选）
  channels:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/channels:${BIUMIND_TAG:-dev}
    container_name: biu-channels
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: channels
      LISTEN_ADDR: ":7007"
      RUNTIME_URL: http://runtime:7002
      # inbound envelopes → JetStream，Runtime 重启不丢（DESIGN.md §17）
      BUS_USE_JETSTREAM: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    ports:
      - "${CHANNELS_PORT:-7007}:7007"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7007/healthz"]
      interval: 10s
      retries: 5

  # AIGC（文生图 / 文生视频 / 数字人 / 爆款解析）— 端口 7012（DESIGN.md §19）。设计见 docs/BiuMind-AIGC-*.md
  aigc:
    profiles: [services, all]
    image: ${BIUMIND_REGISTRY:-biumind}/aigc:${BIUMIND_TAG:-dev}
    container_name: biu-aigc
    <<: [*restart, *logging]
    environment:
      <<: [*svc-env, *svc-env-extra]
      SERVICE_NAME: aigc
      LISTEN_ADDR: ":7012"
      AIGC_DATABASE_URL: postgres://${POSTGRES_USER:-biumind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biu_core}?sslmode=disable
      AIGC_MIGRATIONS_DIR: /etc/biumind/migrations/aigc
      AIGC_IDENTITY_URL: http://identity:7004
      # 服务间共享 bearer — 缺则 POST /v1/generations 全返 503 billing_not_wired（DESIGN.md §5）
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:-biumind-dev-internal-token-change-me}
      # P4.S1.3: aigc → model-relay 取 envelope 解密凭证注入 NATS payload（DESIGN.md §11）
      AIGC_MODEL_RELAY_URL: http://model-relay:7001
      NATS_URL: nats://nats:4222
      # MinIO / S3（5 bucket 由 minio-bootstrap 建，DESIGN.md §16）
      AIGC_S3_ENDPOINT: ${AIGC_S3_ENDPOINT:-http://minio:9000}
      AIGC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-biumind}
      AIGC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-biumind_minio_dev}
      AIGC_S3_REGION: us-east-1
      AIGC_S3_USE_SSL: "false"
      # 上游 provider keys（P3 才用；空则 worker 拒收 submit）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
    ports:
      - "${AIGC_PORT:-7012}:7012"
    networks: [biu-net]
    depends_on:
      <<: *svc-depends
      identity:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7012/healthz"]
      interval: 10s
      retries: 5
