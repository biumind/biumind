# Alertmanager 路由 — webhook → identity → DB SMTP 配置 → 发邮件.
#
# 设计:
#   - alertmanager 不直接发邮件 (避免在文件里存 SMTP 密码)
#   - 所有告警都 POST 到 identity:7004/v1/internal/alerts/email
#   - identity 从 biumind_system.config (key='alert.email') 读 SMTP 配置
#   - superadmin 在 admin UI 改 SMTP 配置, 立即生效不用重启
#
# 容器仅在 biu-net 内部访问 identity, 不需要 X-Biumind-Webhook 校验
# (内部网络已是信任边界). 如果想加额外安全, 在 identity SMTP config
# 里填 webhook_secret 字段, alertmanager 这里加 http_config.headers.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'biumind-default'

  routes:
    - match: { severity: critical }
      receiver: 'biumind-critical'
      group_wait: 10s
      repeat_interval: 1h

    - match: { severity: warning }
      receiver: 'biumind-default'
      group_interval: 30m
      repeat_interval: 24h

    - match: { severity: info }
      receiver: 'biumind-default'
      group_interval: 1h
      repeat_interval: 7d

receivers:
  - name: 'biumind-default'
    webhook_configs:
      - url: 'http://identity:7004/v1/internal/alerts/email'
        send_resolved: true

  - name: 'biumind-critical'
    webhook_configs:
      - url: 'http://identity:7004/v1/internal/alerts/email'
        send_resolved: true

# 抑制规则
inhibit_rules:
  - source_match: { alertname: 'ServiceDown', severity: 'critical' }
    target_match_re: { alertname: 'High.*' }
    equal: ['service']
