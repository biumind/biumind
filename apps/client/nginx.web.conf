# Nginx config for the Flutter Web client.
#
# Three responsibilities:
#   1. SPA fallback: any non-file path returns index.html so client-side
#      routing (GoRouter) handles /chat/abc, /settings, etc.
#   2. Aggressive caching for hashed/static assets (main.dart.js,
#      sqlite3.wasm, fonts) — they're content-hashed by Flutter's build.
#   3. /healthz for the Docker HEALTHCHECK.

server {
    listen       80;
    listen       [::]:80;       # alpine wget 默认 IPv6 优先 (localhost → ::1), healthcheck 必需
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Health probe
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Static assets: long cache, immutable. Flutter hashes filenames
    # so cache invalidation just works.
    location ~* \.(js|wasm|json|png|svg|ico|woff2?|otf|ttf|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — never cache (must pick up new app version).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        # COOP/COEP enable cross-origin isolation, required for some
        # OPFS / SharedArrayBuffer paths on web. Drift WasmDatabase
        # benefits but is not strictly required.
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "credentialless";
        try_files $uri =404;
    }

    # SPA fallback: any other path → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip the obvious things
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}
