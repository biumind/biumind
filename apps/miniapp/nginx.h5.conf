# BiuMind MiniApp H5 SPA — 容器内 nginx 配置.
#
# 跟 admin / web-client 同模式:
# - web/site nginx 反代时 rewrite ^/m/(.*)$ /$1 break + proxy_pass 不带 URI,
#   所以本容器收到的是剥前缀后的路径 (e.g. GET /, GET /assets/x.js)
# - 不接收 /v1/* 请求 (那个由 site nginx 直接分发到后端)
# - 容器内 root 提供, SPA fallback 到 /index.html
# - 必须 listen [::]:80 否则 alpine wget healthcheck (IPv6 优先) 失败

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全头 — 跟 admin 同套
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # 健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的静态资源 (vite/uni-app 输出在 assets/ 与 static/) → 长缓存
    location ~* ^/(assets|static)/.+\.(js|css|wasm|json|png|jpg|jpeg|gif|svg|ico|woff2?|otf|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 无 hash 静态资源 (favicon 等) — 短缓存
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|otf|ttf|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # HTML 永不缓存, 拿最新版本
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: 任何不是文件的路径 → /index.html (vue-router history mode)
    # 例: site nginx 转 /pages/me/oauth-return → 这里 try_files → /index.html → vue-router 渲染
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml;
}
