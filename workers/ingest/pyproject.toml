[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biumind-ingest-worker"
version = "0.1.0"
description = "Binary content ingestion worker (PDF / OCR / Whisper) for BiuMind Brain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BiuMind" }]

# All heavy extractors are *optional* — the worker starts with whatever
# is installed and falls back to a clear "extractor not available" error
# for the kinds it can't handle. This keeps the base image small and
# lets operators pick exactly which formats their deployment supports.
dependencies = [
  "nats-py>=2.7,<3",
]

[project.optional-dependencies]
pdf      = ["pypdf>=4.0,<6"]
ocr      = ["pytesseract>=0.3.10,<1", "Pillow>=10,<12"]
whisper  = ["faster-whisper>=1.0,<2"]
all      = [
  "pypdf>=4.0,<6",
  "pytesseract>=0.3.10,<1",
  "Pillow>=10,<12",
  "faster-whisper>=1.0,<2",
]
dev      = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
biumind-ingest-worker = "biumind_ingest.__main__:main"

[tool.setuptools.packages.find]
include = ["biumind_ingest*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
